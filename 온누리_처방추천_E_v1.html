<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온누리 한의원 — 처방 추천 E</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --taeum:#2D7D46; --taeum-l:#E8F5EC; --taeum-bg:#F4FBF6;
  --soyang:#D4691E; --soyang-l:#FDF1E5; --soyang-bg:#FEF8F2;
  --gold:#C49A3F; --gold-l:#FEF9E6;
  --hot:#C9302C; --hot-l:#FBE4E1; --cold:#2E5C8A; --cold-l:#E1EBFB;
  --yang:#A07600; --yang-l:#FFF4D6; --yin:#5E4A8A; --yin-l:#E8E0F2;
  --ink:#1a1a1a; --sub:#555; --line:#d5d5d5;
  --bg:#faf8f3; --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif;
  --pale:#f7f5f0; --txt3:#9c9590; --bg2:#f1ede4; --crimson:#c9302c;
}
html{font-size:16px;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}

.wrap{max-width:980px;margin:0 auto;padding:24px 16px 56px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px 28px;box-shadow:0 2px 12px rgba(0,0,0,.05);}

.safety-banner{background:#fdf3f3;border:1px solid #e3b9b9;color:#8a3a3a;font-size:.75rem;
  padding:8px 14px;border-radius:6px;text-align:center;margin-bottom:14px;line-height:1.5;}

.head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px;}
.h-top{display:flex;justify-content:space-between;align-items:baseline;}
.clinic{font-size:.72rem;letter-spacing:1.5px;color:var(--sub);}
.ver{font-size:.68rem;color:var(--gold);font-weight:700;letter-spacing:1px;}
.h-title{font-family:var(--serif);font-size:1.36rem;font-weight:700;margin-top:6px;}
.h-sub{font-size:.78rem;color:var(--sub);margin-top:6px;}

/* 환자 요약 카드 */
.patient-card{background:linear-gradient(to right,var(--taeum-bg),#fff);border:1px solid var(--line);
  border-left:4px solid var(--taeum);padding:14px 18px;margin-bottom:16px;border-radius:0 6px 6px 0;}
.pc-row{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;font-size:.84rem;}
.pc-label{font-size:.62rem;color:var(--sub);letter-spacing:1px;margin-right:5px;}
.pc-type{color:var(--taeum);font-size:1rem;font-weight:700;}
.pc-chip{display:inline-block;padding:2px 9px;border:1px solid var(--line);border-radius:12px;
  font-size:.72rem;font-weight:600;}
.pc-chip.cold{background:var(--cold-l);border-color:#bcd1ea;color:var(--cold);}
.pc-chip.hot{background:var(--hot-l);border-color:#e8c0bc;color:var(--hot);}
.pc-chip.yang{background:var(--yang-l);border-color:#e8d896;color:var(--yang);}
.pc-chip.yin{background:var(--yin-l);border-color:#cdbfe3;color:var(--yin);}
.pc-chip.none{background:var(--bg2);color:var(--sub);}
.pc-basis{font-size:.74rem;color:var(--sub);margin-top:8px;}

/* info 폴백 */
.info-sec{padding:12px 0;border-bottom:1px solid var(--line);}
.info-row{display:flex;gap:12px;font-size:.86rem;padding:4px 0;}
.info-lbl{width:80px;color:var(--sub);font-weight:500;flex-shrink:0;}
.notice{background:var(--gold-l);border:1px solid #e0cf8e;border-radius:6px;
  padding:12px 14px;font-size:.82rem;line-height:1.6;color:#5a4d20;}
.sel-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
.fld{padding:9px 11px;border:1px solid var(--line);border-radius:5px;font-family:inherit;
  font-size:.85rem;background:#fff;color:var(--ink);}
.fld:focus{outline:none;border-color:var(--taeum);}

/* 주소증 입력 */
.input-sec{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fafafa;margin-bottom:18px;}
.is-title{font-size:.84rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.is-num{background:var(--ink);color:#fff;width:20px;height:20px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:.62rem;flex-shrink:0;}
.is-hint{font-size:.7rem;color:var(--sub);margin-bottom:7px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:14px;
  font-size:.78rem;cursor:pointer;font-family:inherit;color:var(--ink);}
.chip:hover{border-color:var(--taeum);}
.chip.on{background:var(--taeum);color:#fff;border-color:var(--taeum);font-weight:500;}
.chip.custom{border-style:dashed;}
.chip.custom.on{background:var(--gold);border-color:var(--gold);border-style:solid;}
.custom-sym-row{display:flex;gap:6px;margin:4px 0 12px;}
.custom-sym-input{flex:1;font-family:inherit;font-size:.84rem;padding:7px 10px;
  border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
.custom-sym-input:focus{outline:none;border-color:var(--ink);}
.free-input{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 10px;
  font-family:inherit;font-size:.8rem;min-height:46px;resize:vertical;background:#fff;color:var(--ink);}
.free-input:focus{outline:none;border-color:var(--taeum);}

/* 추천 처방 */
.rx-sec-title{font-size:.95rem;font-weight:700;padding:10px 0 9px;border-bottom:2px solid var(--ink);
  margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.rx-sec-title .pill{background:var(--taeum);color:#fff;padding:3px 10px;border-radius:3px;font-size:.68rem;}
.rx-sec-title .sub{font-size:.72rem;color:var(--sub);font-weight:400;margin-left:auto;}
.rx-card{border:1px solid var(--line);border-radius:7px;margin-bottom:13px;background:#fff;overflow:hidden;}
.rx-card.top{border:2px solid var(--taeum);}
.rx-head{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);background:#fafafa;}
.rx-card.top .rx-head{background:var(--taeum-l);}
.rx-rank{background:#888;color:#fff;width:25px;height:25px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex-shrink:0;}
.rx-card.top .rx-rank{background:var(--taeum);}
.rx-name{font-size:1rem;font-weight:700;}
.rx-name .hanja{font-size:.7rem;color:var(--sub);font-weight:400;margin-left:5px;}
.rx-match{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:.7rem;color:var(--sub);}
.match-bar{width:62px;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;}
.match-bar>div{height:100%;background:var(--taeum);}
.rx-body{padding:13px 15px;}
.rx-line{margin-bottom:9px;font-size:.8rem;line-height:1.6;}
.rx-line:last-child{margin-bottom:0;}
.rs-lbl{display:inline-block;font-size:.62rem;font-weight:700;color:var(--gold);letter-spacing:.5px;
  background:var(--gold-l);padding:2px 7px;border-radius:2px;margin-right:6px;vertical-align:middle;}
.rs-lbl.warn{color:var(--crimson);background:var(--hot-l);}
.rs-lbl.signal{color:var(--cold);background:var(--cold-l);}
.rs-na{color:var(--txt3);font-style:italic;}
.rev-badge{display:inline-block;font-size:.6rem;font-weight:600;color:#8a6f1f;background:var(--gold-l);
  border:1px solid #e0cf8e;border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:middle;}
.ryu-badge{display:inline-block;font-size:.6rem;font-weight:700;color:#fff;background:var(--taeum);
  border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:middle;}
.rs-lbl.ref{color:var(--cold);background:var(--cold-l);}
.ryu-note{font-size:.66rem;color:var(--txt3);margin-left:2px;}
.ryu-item{background:var(--pale);border:1px solid var(--line);border-radius:4px;
  padding:6px 9px;margin-top:5px;font-size:.74rem;}
.ryu-item b{font-size:.76rem;}
.ryu-comp{color:var(--sub);margin-top:2px;line-height:1.5;}
.gamga{background:var(--pale);border-radius:4px;padding:8px 11px;font-size:.74rem;margin-top:7px;}
.gamga .gm-t{font-size:.74rem;color:var(--sub);margin-bottom:6px;font-weight:600;}
.gamga .gm-line{display:block;width:100%;text-align:left;padding:7px 11px;font-size:.78rem;color:var(--sub);line-height:1.55;border-radius:5px;margin-top:4px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;}
.gamga .gm-line:hover{border-color:var(--ink);background:var(--pale);}
.gamga .gm-line.hit{font-weight:600;color:var(--ink);background:var(--gold-l);border-color:var(--gold);}
.gamga .gm-line.hit::before{content:"✓ ";color:var(--gold);font-weight:700;}
.gamga .gm-line.sel{background:var(--taeum-l);border:2px solid var(--taeum);color:var(--ink);font-weight:600;}
.gamga .gm-line.sel::before{content:"☑ ";color:var(--taeum);font-weight:700;}
.gamga .gm-line.sel.hit::before{content:"☑ ✓ ";}
.rs-lbl.match{background:var(--taeum-l);color:var(--taeum);}
.search-trigger{display:flex;align-items:center;gap:14px;justify-content:center;margin:18px 0 12px;flex-wrap:wrap;padding:14px;background:var(--pale);border-radius:8px;}
.search-hint{font-size:.78rem;color:var(--sub);}
.rx-empty{margin:14px 0;}
.rx-diag{margin:10px 0 14px;padding:10px 14px;border-radius:6px;font-size:.82rem;line-height:1.55;border:1px solid var(--line);background:#fafafa;}
.rx-diag .dg-t{font-weight:700;font-size:.78rem;letter-spacing:.02em;display:inline-block;padding:2px 8px;border-radius:3px;margin-right:8px;vertical-align:1px;}
.rx-diag.ok{background:#f2f8f3;border-color:#cfe3d2;}
.rx-diag.ok .dg-t{background:#3a7d44;color:#fff;}
.rx-diag.info{background:#f5f7fb;border-color:#d8e0ec;}
.rx-diag.info .dg-t{background:#4a6cb3;color:#fff;}
.rx-diag.warn{background:#fdf5ee;border-color:#e9caa1;}
.rx-diag.warn .dg-t{background:#b86a1a;color:#fff;}
.rx-diag .dg-row{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:5px;color:var(--sub);font-size:.76rem;}
.rx-diag .dg-row b{color:var(--ink);font-weight:600;}
.rx-diag .dg-hint{margin-top:6px;font-size:.76rem;color:var(--sub);}
.rx-foot{padding:9px 15px;border-top:1px solid var(--line);background:#fafafa;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.rx-source{margin-left:auto;font-size:.66rem;color:var(--sub);}

/* 검색 폴백 */
.search-box{margin-top:8px;}
.search-results{margin-top:10px;max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;}
.sr-item{padding:8px 12px;border-bottom:1px solid var(--line);font-size:.78rem;}
.sr-item:last-child{border-bottom:none;}
.sr-name{font-weight:600;}
.sr-comp{color:var(--sub);font-size:.72rem;margin-top:2px;}

/* 안내 */
.caveat{background:#fff8e8;border:1px solid #e9d896;border-radius:5px;padding:11px 14px;
  margin:16px 0;font-size:.74rem;color:#5a4d20;line-height:1.7;}
.caveat b{color:#8a6f1f;}

/* 최종 결정 */
.final-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.final-box{background:var(--pale);border:1px solid var(--line);border-radius:6px;padding:11px 13px;}
.fb-lbl{font-size:.64rem;color:var(--sub);letter-spacing:.5px;margin-bottom:6px;}
.f-area{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 10px;
  font-family:inherit;font-size:.82rem;background:#fff;color:var(--ink);resize:vertical;}
.f-area:focus{outline:none;border-color:var(--taeum);}
.f-input{width:100%;border:1px solid var(--line);border-radius:5px;padding:7px 10px;
  font-family:inherit;font-size:.82rem;background:#fff;color:var(--ink);}
.f-input:focus{outline:none;border-color:var(--taeum);}

/* 버튼 */
.btn{padding:9px 16px;border-radius:6px;font-size:.83rem;font-family:inherit;cursor:pointer;border:1.5px solid;}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-line{background:#fff;color:var(--ink);border-color:var(--line);}
.btn-sm{padding:6px 12px;font-size:.76rem;}
.btn-dark:hover:not(:disabled){opacity:.88;}
.btn-line:hover{background:var(--bg2);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.actions-card{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:16px 20px;}

.status-box{padding:10px 14px;border-radius:6px;font-size:.83rem;margin:14px 0;}
.status-box.done{background:var(--taeum-l);border:1px solid var(--taeum);color:var(--taeum);font-weight:600;}

.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);}
.safe-notes{font-size:.74rem;color:#7a6a3a;line-height:1.75;background:var(--gold-l);border-radius:6px;padding:9px 13px;}
.source{font-size:.7rem;color:var(--txt3);margin-top:8px;text-align:right;}

@media print{
  @page{margin:12mm;}
  body{background:#fff;}
  .no-print{display:none!important;}
  .wrap{max-width:100%;padding:0;}
  .card,.actions-card{border:none;box-shadow:none;padding:0;border-radius:0;}
  .rx-card,.final-grid,.final-box,.foot,.patient-card{break-inside:avoid;}
  .match-bar>div{background:#888!important;}
  .status-box{background:#fff!important;border-color:#999!important;color:var(--ink)!important;}
  .h-title{font-size:1.18rem;}
}
@media(max-width:620px){
  .sel-grid,.final-grid{grid-template-columns:1fr;}
  .pc-row{gap:12px;}
}
/* ── 변증 기반 전체 처방 패널 (류주열 변증서 전사) ── */
.bj-sec{margin-top:22px;border-top:2px solid var(--line);padding-top:16px;}
.bj-title{font-family:var(--serif);font-weight:700;font-size:1.02rem;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bj-title .pill{background:var(--ink);color:#fff;font-size:.68rem;padding:2px 9px;border-radius:10px;font-weight:500;}
.bj-note{font-size:.74rem;color:var(--sub);margin:6px 0 10px;line-height:1.65;}
.bj-search input{width:100%;}
.bj-cnt{font-size:.73rem;color:var(--txt3);margin:9px 0 5px;}
.bj-row{border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:#fff;overflow:hidden;}
.bj-row.open{border-color:var(--ink);}
.bj-rh{padding:9px 12px;cursor:pointer;display:flex;gap:9px;align-items:baseline;}
.bj-rh:hover{background:var(--pale);}
.bj-jeung{font-weight:600;font-size:.9rem;color:var(--ink);white-space:nowrap;}
.bj-cat{font-size:.66rem;color:var(--txt3);background:var(--bg2);padding:1px 7px;border-radius:8px;white-space:nowrap;}
.bj-sxp{font-size:.74rem;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bj-detail{padding:4px 12px 12px;border-top:1px dashed var(--line);}
.bj-sxf{font-size:.76rem;color:var(--sub);line-height:1.7;margin:9px 0 10px;}
.bj-rx{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:5px;}
.bj-rx.match{border-color:var(--ink);background:var(--gold-l);}
.bj-role{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:9px;white-space:nowrap;}
.bj-role.hot{background:var(--hot-l);color:var(--hot);}
.bj-role.cold{background:var(--cold-l);color:var(--cold);}
.bj-role.any{background:var(--bg2);color:var(--sub);}
.bj-rxname{font-weight:600;font-size:.85rem;color:var(--ink);}
.bj-rxcode{font-size:.7rem;color:var(--txt3);}
.bj-rx button{margin-left:auto;}
.bj-comp{flex-basis:100%;font-size:.75rem;color:var(--sub);}
</style>
</head>

</div>
<div id="wrap" class="wrap"></div>
<script>
/* ═══════════════════════════════════════════════════

/* ── 큐레이션 처방 (data/prescriptions_curated.json) ── */

   ryuCode:null = 류주열 책 미수록(고전 처방). verified:false = 원장 미검수(한열·주증 등). */
const RX_CURATED = [
 {id:'taeum_jowi',name:'태음조위탕',hanja:'太陰調胃湯',constitution:'taeum',hanyul:'cold',yangyin:'yang',verified:false,
  ryuCode:'H019',composition:'의이인12 건율12 나복자8 마황4 맥문동4 길경4 오미자4 석창포4',
  ryuAltCodes:['H020'],classicRef:'고전 사상의학에도 동명 태음조위탕 — 구성 차이 가능(참조)',

  caution:'마황 함유 → 음허·심계·불면자에게 부적합.',
  unfitSignal:'복용 후 불면·심계·구갈·피부건조 발생 시 → 음형으로 재평가, 갈근조위탕 또는 음형 처방으로 전환.',
  alternatives:['갈근조위탕'],
  gamga:['+갈근 2돈·승마 1돈 (비병·표열 겸함)','+산약·연자육 각 2돈 (보비·보신, 변비 경향)','+대황 3푼 (술 많이 마시는 환자)'],
  source:'류주열 사상처방개정판 H019 · 한열/주증은 원장 검수 대상'},
 {id:'galgeun_jowi',name:'갈근조위탕',hanja:'葛根調胃湯',constitution:'taeum',hanyul:'hot',yangyin:'any',verified:false,
  ryuCode:null,composition:null,
  ryuAltCodes:[],classicRef:'고전 처방 — 류주열 책에 동명 미수록. 원장이 쓰시는 류주열 대응 처방 확인 필요',
  symptoms:['변비','두통','다한증'],

/* ── §7 매칭 로직 ──
   체질·한열 필터 + 음양형 점수 + 주소증(부분 일치) + 부증상 메모(보너스). */
function symContains(symList, q){
  if (!symList || !symList.length || !q) return false;
  q = String(q).trim(); if (!q) return false;
  for (var i = 0; i < symList.length; i++){
    var s = symList[i]; if (!s) continue;
    if (s === q) return true;
    if (s.indexOf(q) >= 0 || q.indexOf(s) >= 0) return true;   // 부분 일치
  }
  return false;
}

/* ── 류주열식 매칭 엔진 (W4 신규) ──
   1) 환자 주소증·부증상 → SX_DICT lookup → 한문 후보 키워드 풀
   2) BYEONJEUNG 변증 중 sx 부분 일치하는 후보 변증 추출
   3) 환자 체질(BJ_CK)·한열에 해당하는 류주열 코드 수집 (코드별 hit 카운트 누적)
   4) RX_FULL에서 코드 일치 처방 + 큐레이션 즐겨찾기 boost 반영해 top N 정렬
*/

// 한글 토큰 → 한문 키워드 후보 풀 (SX_DICT 부분 키 매칭 포함)
function ko2hans(token){
  if (!token) return [];
  token = String(token).trim();
  if (!token) return [];
  // 정확 매칭 우선
  if (SX_DICT[token]) return SX_DICT[token].slice();
  // 부분 키 매칭 (예: "변비기" 입력 시 "변비" 키 hit)
  const out = [];
  const keys = Object.keys(SX_DICT);
  for (var i = 0; i < keys.length; i++){
    var k = keys[i];
    if (token.indexOf(k) >= 0 || k.indexOf(token) >= 0){
      var arr = SX_DICT[k];
      for (var j = 0; j < arr.length; j++) if (out.indexOf(arr[j]) < 0) out.push(arr[j]);
    }
  }
  return out;
}

// 부증상 메모(자유 텍스트)에서 SX_DICT 키와 일치하는 한글 단어 스캔
function freeTextToHans(freeText){
  if (!freeText) return { hans:[], hitKeys:[] };
  const ft = String(freeText);
  const hans = [], hitKeys = [];
  const keys = Object.keys(SX_DICT);
  for (var i = 0; i < keys.length; i++){
    var k = keys[i];
    if (k.length >= 2 && ft.indexOf(k) >= 0){
      hitKeys.push(k);
      var arr = SX_DICT[k];
      for (var j = 0; j < arr.length; j++) if (hans.indexOf(arr[j]) < 0) hans.push(arr[j]);
    }
  }
  return { hans:hans, hitKeys:hitKeys };
}

// 변증의 sx 배열이 한문 후보 풀 중 하나라도 포함하는지 (부분 일치)
function bjSxMatches(sxList, hansPool){
  if (!sxList || !sxList.length || !hansPool.length) return 0;
  let hits = 0;
  for (var i = 0; i < sxList.length; i++){
    var s = sxList[i]; if (!s) continue;
    for (var j = 0; j < hansPool.length; j++){
      var h = hansPool[j];
      if (s === h || s.indexOf(h) >= 0 || h.indexOf(s) >= 0){ hits++; break; }
    }
  }
  return hits;
}

// 큐레이션 8종의 류주열 코드 셋 (즐겨찾기 boost용)
function curatedFavCodes(constitution){
  const out = {};
  for (var i = 0; i < RX_CURATED.length; i++){
    var c = RX_CURATED[i];
    if (c.constitution === constitution && c.ryuCode) out[c.ryuCode] = c;
  }
  return out;
}

// 메인: 류주열 처방 풀에서 주소증 기반 추천 top N
function matchPrescriptionsRyu(profile, chiefComplaints, freeText, topN){
  topN = topN || 5;
  freeText = String(freeText || '').trim();
  const ck = BJ_CK[profile.constitution];
  if (!ck) return { matches:[], diag:{ reason:'unknown-constitution' } };
  const wantedHanyul = (profile.hanyul === 'mixed') ? null : profile.hanyul; // null=both

  // 1) 환자 입력 → 한문 후보 풀
  const ccHansMap = {};  // hans -> [원본 한글 주소증]
  chiefComplaints.forEach(function(cc){
    const hans = ko2hans(cc);
    hans.forEach(function(h){
      if (!ccHansMap[h]) ccHansMap[h] = [];
      if (ccHansMap[h].indexOf(cc) < 0) ccHansMap[h].push(cc);
    });
  });
  const ccHansPool = Object.keys(ccHansMap);
  const ftScan = freeTextToHans(freeText);
  const ftHansPool = ftScan.hans;
  const allHansPool = ccHansPool.concat(ftHansPool.filter(function(h){ return ccHansPool.indexOf(h)<0; }));

  // 2) 변증 후보 추출 + 코드별 hit 누적
  const codeScore = {};  // code -> {score, jeungList:[], sxMatched:[]}
  let bjMatched = 0;
  for (var i = 0; i < BYEONJEUNG.length; i++){
    var bj = BYEONJEUNG[i];
    var ccHit = bjSxMatches(bj.sx, ccHansPool);
    var ftHit = bjSxMatches(bj.sx, ftHansPool);
    if (ccHit === 0 && ftHit === 0) continue;
    bjMatched++;
    var rxBranch = (bj.rx && bj.rx[ck]) || null;
    if (!rxBranch) continue;
    // 한열별 코드 수집
    var pickRoles = wantedHanyul ? [wantedHanyul, 'any'] : ['hot', 'cold', 'any'];
    for (var r = 0; r < pickRoles.length; r++){
      var role = pickRoles[r];
      var codes = rxBranch[role] || [];
      for (var c = 0; c < codes.length; c++){
        var code = codes[c];
        if (!codeScore[code]) codeScore[code] = { score:0, jeung:[], sxMatched:[], roleSet:{} };
        codeScore[code].score += ccHit * 3 + ftHit * 1;
        if (codeScore[code].jeung.indexOf(bj.jeung) < 0) codeScore[code].jeung.push(bj.jeung);
        codeScore[code].roleSet[role] = true;
        // 어떤 한문 sx가 맞았는지 기록
        for (var s = 0; s < bj.sx.length; s++){
          var sx = bj.sx[s];
          for (var p = 0; p < allHansPool.length; p++){
            var h = allHansPool[p];
            if (sx === h || sx.indexOf(h) >= 0 || h.indexOf(sx) >= 0){
              if (codeScore[code].sxMatched.indexOf(sx) < 0) codeScore[code].sxMatched.push(sx);
              break;
            }
          }
        }
      }
    }
  }

  // 3) 큐레이션 즐겨찾기 boost
  const fav = curatedFavCodes(profile.constitution);
  Object.keys(codeScore).forEach(function(code){
    if (fav[code]) codeScore[code].score += 8;  // 즐겨찾기 boost
  });

  // 4) RX_FULL과 조인 + top N
  const ranked = Object.keys(codeScore)
    .map(function(code){
      var rxRef = null;
      for (var i = 0; i < RX_FULL.length; i++) if (RX_FULL[i].code === code){ rxRef = RX_FULL[i]; break; }
      if (!rxRef) return null;
      return {
        code: code,
        rx: rxRef,
        score: codeScore[code].score,
        jeung: codeScore[code].jeung,
        sxMatched: codeScore[code].sxMatched,
        isFav: !!fav[code],
        favRef: fav[code] || null
      };
    })
    .filter(function(x){ return x !== null; })
    .sort(function(a,b){
      if (b.score !== a.score) return b.score - a.score;
      if (b.isFav !== a.isFav) return b.isFav ? 1 : -1;
      return 0;
    })
    .slice(0, topN);

  return {
    matches: ranked,
    diag: {
      ccHansPool: ccHansPool,
      ccHansMap: ccHansMap,
      ftHansPool: ftHansPool,
      ftHitKeys: ftScan.hitKeys,
      bjMatched: bjMatched,
      totalCandidates: Object.keys(codeScore).length,
      missingCC: chiefComplaints.filter(function(cc){ return ko2hans(cc).length === 0; })
    }
  };
}
function matchPrescriptions(profile, chiefComplaints, rxList, freeText){
  freeText = String(freeText || '').trim();
  return rxList
    .filter(function(rx){
      if (rx.constitution !== profile.constitution) return false;
      if (rx.hanyul !== 'any' && profile.hanyul !== 'mixed' && rx.hanyul !== profile.hanyul) return false;
      return true;
    })
    .map(function(rx){
      let score = 40 + 25;
      if (profile.constitution === 'taeum'){
        if (rx.yangyin === 'any' || rx.yangyin === profile.yangyin) score += 15;
      } else { score += 15; }
      // ── 주소증 매칭 (부분 일치 허용) ── 처방의 주증이 환자 주소증을 포함하거나 그 반대
      let hit = 0;
      chiefComplaints.forEach(function(c){ if (symContains(rx.symptoms, c)) hit++; });
      const ratio = chiefComplaints.length ? hit / chiefComplaints.length : 0;
      score += Math.round(22 * ratio);
      // ── 부증상 메모(freeText)에 처방의 주증 키워드가 포함되면 가산 ──
      let freeHits = 0;
      if (freeText && rx.symptoms){
        for (var j = 0; j < rx.symptoms.length; j++){
          var s = rx.symptoms[j]; if (!s) continue;
          if (freeText.indexOf(s) >= 0) freeHits++;
        }
      }
      if (freeHits > 0) score += Math.min(12, freeHits * 4);
      return { rx:rx, score:score, hitCount:hit, freeHits:freeHits };
    })
    .sort(function(a,b){ return b.score - a.score; })
    .slice(0, 3);
}

  const ma = session.moduleA;
  // 이전 검사 결과로 체질·한열 자동 채움. 우선순위: D(원장 판정) > C(태음↔소양 확정) > A(자가설문 우세)
  // 모듈 A는 단축 코드(te/sy/ty/se), D·C는 긴 키(taeum/soyang/…)를 쓰므로 정규화.
  const C_NORM = { te:'taeum', sy:'soyang', ty:'taeyang', se:'soeum',
                   taeum:'taeum', soyang:'soyang', taeyang:'taeyang', soeum:'soeum' };
  let constitution = null, hanyul = null, yangyin = 'none';
  if (md && md.finalConstitution){
    constitution = C_NORM[md.finalConstitution] || md.finalConstitution;
    hanyul       = md.finalHanyul || null;
    yangyin      = md.finalYangYin || 'none';
  } else if (mc && mc.verdict && mc.verdict !== 'pending'){
    constitution = C_NORM[mc.verdict] || mc.verdict;          // 'taeum' / 'soyang'
  } else if (ma && ma.result && ma.result.top){
    constitution = C_NORM[ma.result.top] || ma.result.top;    // A의 우세 체질
  }
  if (!hanyul && ma && ma.hanyul) hanyul = ma.hanyul;          // 한열은 모듈 A에서 보강
  if (constitution){
    profile = { constitution: constitution, hanyul: hanyul || 'mixed', yangyin: yangyin };
  }
  const me = session.moduleE;
  if (me){
    chiefComplaints = (me.chiefComplaints || []).slice();
    freeText = me.freeText || '';
    finalForm = Object.assign({prescription:'',period:'',revisit:'',note:''}, me.selected || {});
    confirmed = true;
    searched = true;   // 이전 세션이 있으면 추천도 자동 표시
    step = 2;
  }
}
function saveSession(){
  const top3 = profile ? matchPrescriptions(profile, chiefComplaints, RX_CURATED, freeText) : [];
  session.moduleE = {
    chiefComplaints: chiefComplaints.slice(),
    freeText: freeText,
    candidates: top3.map(function(m){ return {id:m.rx.id, name:m.rx.name, score:m.score}; }),
    selected: {
      prescription: finalForm.prescription,
      period: finalForm.period,
      revisit: finalForm.revisit,
      note: finalForm.note,
    },
    completedAt: Date.now(),
  };
  localStorage.setItem('onnuri_session', JSON.stringify(session));
}

/* ── 환자 표시 ── */
function patientName(){
  const p = session.patient || {};
  const bits = [];
  if (p.name) bits.push(esc(p.name));
  if (p.gender) bits.push(esc(p.gender));
  if (p.age) bits.push(esc(String(p.age)) + '세');
  return bits.length ? bits.join(' · ') : '환자 정보 없음';
}
function moduleDBasis(){
  const md = session.moduleD;
  if (!md) return '';
  const dt = md.drugTrial || {};
  const parts = [];
  if (dt.prescription) parts.push('약물 시험 ' + esc(dt.prescription));
  if (dt.fitness === 'fit') parts.push('적합(4대 기준 ' + (dt.improveCount||0) + '개 호전)');
  else if (dt.fitness === 'unfit') parts.push('부적합');
  return parts.join(' · ');
}
function getChips(p){
  const bc = SYMPTOM_CHIPS[p.constitution] || {};
  if (p.hanyul === 'mixed') return (bc.cold||[]).concat(bc.hot||[], bc.any||[]);
  return bc[p.hanyul] || bc.any || [];
}

    let diagHtml = '';
    if (!hasInputs){
      // 입력 없이 검색만 누른 경우
      diagHtml = '<div class="rx-diag info">'
        + '<span class="dg-t">처방 조회 안내</span>'
        + '<b>' + esc(cName) + ' · ' + esc(hName) + '</b> — '
        + '주소증·부증상 입력이 없어 추천을 산출하지 않았습니다.'
        + '<div class="dg-hint">▣ 위에서 주소증 칩을 선택하거나 부증상 메모를 입력하신 뒤 다시 「🔍 처방 검색」을 눌러주세요.</div>'
        + '</div>';
    } else if (matches.length === 0){
      // 매칭 0건 — 사전 미수록일 가능성 큼
      const missHtml = missingCC.length
        ? '<div class="dg-hint">▣ <b>한문 동의어 사전 미수록 주소증</b>: ' + esc(missingCC.join(', '))
          + ' — 임상에서 자주 쓰시는 단어이면 알려주세요. <code>data/sx_dict.json</code>에 추가됩니다.</div>'
        : '<div class="dg-hint">▣ 입력하신 주소증·부증상과 일치하는 변증이 없습니다. 다른 단어로 시도하거나 아래 처방명 검색을 활용하세요.</div>';
      diagHtml = '<div class="rx-diag warn">'
        + '<span class="dg-t">처방 조회 안내</span>'
        + '<b>' + esc(cName) + ' · ' + esc(hName) + '</b> — 류주열 매칭 0건.'
        + '<div class="dg-row">'
        +   '주소증 입력 <b>' + ccN + '개</b><span>·</span>'
        +   '한문 변환 <b>' + diag.ccHansPool.length + '개</b><span>·</span>'
        +   '메모 hit <b>' + diag.ftHitKeys.length + '개</b><span>·</span>'
        +   '변증 매칭 <b>0건</b>'
        + '</div>'
        + missHtml
        + '</div>';
    } else {
      // 정상 매칭
      const missLine = missingCC.length
        ? '<div class="dg-hint" style="color:var(--crimson)">⚠ 사전 미수록 주소증: <b>' + esc(missingCC.join(', '))
          + '</b> — 이 단어는 매칭에 사용되지 않았습니다.</div>'
        : '';
      diagHtml = '<div class="rx-diag ok">'
        + '<span class="dg-t">류주열식 매칭 결과</span>'
        + '<b>' + esc(cName) + ' · ' + esc(hName) + '</b> — '
        + '류주열 처방 <b>' + matches.length + '건</b>'
        + (favCount ? ' (★ 즐겨찾기 <b>' + favCount + '건</b> 포함)' : '')
        + ' · 주소증·부증상 부합 변증 <b>' + diag.bjMatched + '건</b>에서 도출.'
        + '<div class="dg-row">'
        +   '주소증 <b>' + ccN + '개</b> → 한문 <b>' + diag.ccHansPool.length + '개</b><span>·</span>'
        +   '메모 hit <b>' + diag.ftHitKeys.length + '개</b>'
        +   (diag.ftHitKeys.length ? ' (' + esc(diag.ftHitKeys.join(',')) + ')' : '') + '<span>·</span>'
        +   '후보 처방 <b>' + diag.totalCandidates + '개</b>'
        + '</div>'
        + missLine
        + '</div>';
    }

    let rxArea;
    if (matches.length){
      rxArea = diagHtml + matches.map(function(m,i){ return renderRyuRxCard(m, i+1); }).join('');
    } else {
      const q = searchQuery.trim();
      let results = '';
      if (q){
        const found = RX_FULL.filter(function(r){ return r.name.indexOf(q) >= 0; }).slice(0, 30);
        results = found.length
          ? '<div class="search-results">' + found.map(function(r){
              return '<div class="sr-item"><div class="sr-name">' + esc(r.name)
                + ' <span class="rx-source">' + esc(r.code) + '</span></div>'
                + '<div class="sr-comp">' + esc(r.composition || '구성 정보 없음') + '</div></div>';
            }).join('') + '</div>'
          : '<div class="is-hint">검색 결과 없음</div>';
      }
      rxArea = diagHtml
        + '<div class="notice">아래에서 전체 처방(' + RX_FULL.length + '개)을 처방명으로 검색하거나, 최종 결정란에 직접 입력하세요.'
        + '<div class="search-box"><input class="fld" style="width:100%" placeholder="처방명 검색" '
        + 'value="' + esc(searchQuery) + '" oninput="onSearch(this.value)"></div>' + results + '</div>'
        + '<div class="actions"><button class="btn btn-line" onclick="selectRx(null)">직접 입력으로 최종 결정 →</button></div>';
    }
    rxSection = '<div class="rx-sec-title"><span class="pill">류주열식 추천</span>'
      + (matches.length ? '상위 ' + matches.length + '건 (변증 기반)' : '매칭 없음')
      + '<span class="sub">★ 즐겨찾기는 가감 후보 포함 · 「이 처방으로 선택」 클릭</span></div>'
      + rxArea;
  } else {
    rxSection = '<div class="rx-empty no-print">'
      + '<div style="font-size:.95rem;color:var(--sub);text-align:center;padding:30px 16px;border:1px dashed var(--line);border-radius:8px;background:var(--pale);">'
      +   '↑ 주소증과 부증상을 입력하신 뒤,<br>'
      +   '<b>「🔍 처방 검색」</b> 버튼을 누르면<br>'
      +   '주소증에 맞는 처방이 여기에 표시됩니다.</div></div>';
  }

  return banner()
    + '<div class="card">'
    +   headBlock('처방 추천 — ' + esc(CONST_LABEL[profile.constitution]||'') + ' ' + esc(HANYUL_LABEL[profile.hanyul]||''),
          patientName())
    +   '<div class="input-sec">'
    +     '<div class="is-title"><span class="is-num">1</span>주소증 (주요 호소 증상, 3개까지 권장)</div>'
    +     '<div class="is-hint">▣ 자주 쓰는 주소증 — 체질·한열에 맞게 자동 필터링. 클릭해서 선택하세요.</div>'
    +     '<div class="chips">' + chipHtml + '</div>'
    +     (chiefComplaints.length > 3 ? '<div class="is-hint" style="color:var(--crimson)">주소증 3개 이하 권장 (현재 ' + chiefComplaints.length + '개)</div>' : '')
    +     '<div class="is-title" style="margin-top:14px"><span class="is-num">2</span>부증상 · 임상 메모</div>'
    +     '<div class="is-hint">▣ 한열·주소증 외에 함께 기록할 사항 — 부증상 / 발생 시기·기간 / 강도 / 병력 / 식습관 / 기타 관찰</div>'
    +     '<textarea class="free-input" rows="5" oninput="onFreeText(this.value)" '
    +       'placeholder="예) 환절기마다 비염 악화 (5년 경과). 식후 더부룩 빈번. 대변 2일 1회·단단함. 잠은 잘 자나 환절기엔 불면. 과거 위염 진단. 평소 찬 음식 즐겨 먹음...">' + esc(freeText) + '</textarea>'
    +     '<div class="is-hint" style="font-size:.72rem;color:var(--sub);margin-top:4px">※ 이 메모는 처방·진료 차트에 함께 저장되며, 원장님이 최종 처방을 결정할 때 참고합니다.</div>'
    +   '</div>'
    +   '<div class="search-trigger no-print">'
    +     '<button class="btn btn-dark" onclick="searchRx()" style="font-size:.98rem;padding:13px 32px;font-weight:700">🔍  처방 검색</button>'
    +     '<span class="search-hint">' + (searched ? '✓ 검색됨 — 입력 변경 시 자동 재계산됩니다.' : '주소증·부증상을 입력하고 위 버튼을 누르세요.') + '</span>'
    +   '</div>'
    +   rxSection
    +   caveat()
    + '</div>'
    + '<div class="actions-card no-print">'
    +   '<button class="btn btn-line" onclick="backToInfo()">← 환자 요약으로</button>'
    + '</div>'
    + footer();
}

/* ── 변증 기반 전체 처방 패널 ── */
function renderByeonjeungPanel(){
  if (!profile) return '';
  const ck = BJ_CK[profile.constitution];
  let list = BYEONJEUNG.filter(function(e){
    const b = e.rx[ck];
    return b && ((b.hot&&b.hot.length)||(b.cold&&b.cold.length)||(b.any&&b.any.length));
  });
  const total = list.length;
  const q = bjQuery.trim();
  if (q){
    list = list.filter(function(e){
      if (e.jeung.indexOf(q) >= 0 || e.cat.indexOf(q) >= 0) return true;
      for (let i=0;i<e.sx.length;i++){ if (e.sx[i].indexOf(q) >= 0) return true; }
      return false;
    });
  }
  const cap = 60;
  const rows = list.slice(0, cap).map(function(e){
    const key  = e.cat + '¦' + e.jeung;
    const open = bjOpen === key;
    const b    = e.rx[ck];
    let nRx = 0;
    ['hot','cold','any'].forEach(function(r){ if (b[r]) nRx += b[r].length; });
    const head = '<div class="bj-rh" onclick="onBjToggle(\'' + esc(key).replace(/'/g,"\\'") + '\')">'
      + '<span class="bj-jeung">' + esc(e.jeung) + '</span>'
      + '<span class="bj-cat">' + esc(e.cat) + '</span>'
      + '<span class="bj-sxp">' + esc(e.sx.slice(0,6).join(', ')) + '</span>'
      + '<span class="bj-cat">처방 ' + nRx + '</span></div>';
    let detail = '';
    if (open){
      const rxHtml = ['hot','cold','any'].map(function(role){
        if (!b[role] || !b[role].length) return '';
        return b[role].map(function(code){
          const r    = RX_FULL.filter(function(x){ return x.code===code; })[0];
          const nm   = r ? r.name : code;
          const comp = r ? (r.composition||'') : '';
          const isMatch = (role==='hot'  && profile.hanyul==='hot')
                       || (role==='cold' && profile.hanyul==='cold')
                       || (role==='any')
                       || (profile.hanyul==='mixed');
          return '<div class="bj-rx' + (isMatch?' match':'') + '">'
            + '<span class="bj-role ' + BJ_ROLE[role].cls + '">' + BJ_ROLE[role].ko + '</span>'
            + '<span class="bj-rxname">' + esc(nm) + '</span>'
            + '<span class="bj-rxcode">류주열 ' + esc(code) + '</span>'
            + '<button class="btn btn-dark btn-sm" onclick="pickRxByCode(\'' + esc(code) + '\')">이 처방으로 →</button>'
            + (comp ? '<div class="bj-comp">' + esc(comp) + '</div>' : '')
            + '</div>';
        }).join('');
      }).join('');
      detail = '<div class="bj-detail">'
        + '<div class="bj-sxf"><b>증상(證):</b> ' + esc(e.sx.join(', ')) + '</div>'
        + rxHtml + '</div>';
    }
    return '<div class="bj-row' + (open?' open':'') + '">' + head + detail + '</div>';
  }).join('');
  const cLabel = CONST_LABEL[profile.constitution] || '';
  const cnt = q
    ? ('검색 ' + list.length + '건' + (list.length>cap?(' (상위 '+cap+'건 표시 — 검색어를 좁히세요)'):''))
    : (cLabel + ' 변증 ' + total + '건' + (total>cap?(' — 상위 '+cap+'건 표시, 검색 권장'):''));
  return '<div class="bj-sec">'
    + '<div class="bj-title"><span class="pill">변증 기반 전체 처방</span> 류주열 변증 처방 조회</div>'
    + '<div class="bj-note">큐레이션 8처방 외에, 외감·내상변증편 전사 데이터로 <b>' + esc(cLabel)
    + '</b>의 변증(證)별 류주열 처방을 조회합니다. 책 전사 자료이며 <b>한열·증상은 원장 검수 전</b>입니다. '
    + '변증명·증상은 한자로 검색하세요.</div>'
    + '<div class="bj-search"><input class="fld" placeholder="변증·증상 한자 검색 (예: 鼻塞 · 頭痛 · 泄瀉 · 浮腫 · 비염편→鼻)" '
    + 'value="' + esc(bjQuery) + '" oninput="onBjSearch(this.value)"></div>'
    + '<div class="bj-cnt">' + esc(cnt) + '</div>'
    + (rows || '<div class="is-hint">검색 결과 없음 — 다른 한자 키워드로 시도하세요.</div>')
    + '</div>';
}

/* ═══ 화면 2 — screen-final ═══ */
function renderFinal(){
  return banner()
    + '<div class="card">'
    +   headBlock('최종 처방 결정', patientName() + ' · ' + esc(CONST_LABEL[profile.constitution]||'') + ' ' + esc(HANYUL_LABEL[profile.hanyul]||''))
    +   (chosenRx ? '<div class="patient-card"><div class="pc-row"><div><span class="pc-label">추천에서 선택</span>'
          + '<span class="pc-type">' + esc(chosenRx.name) + '</span> <span style="font-size:.72rem;color:var(--sub)">' + esc(chosenRx.hanja||'') + '</span></div></div></div>'
        : '<div class="notice" style="margin-bottom:14px">추천 목록에서 선택하지 않고 직접 입력하는 경우입니다.</div>')
    +   '<div class="fb-lbl">선택 처방 (가감 포함, 자유 수정 가능)</div>'
    +   '<textarea class="f-area" rows="2" oninput="onFinal(\'prescription\',this.value)" '
    +     'placeholder="처방명 + 가감...">' + esc(finalForm.prescription) + '</textarea>'
    +   '<div class="final-grid" style="margin-top:12px">'
    +     '<div class="final-box"><div class="fb-lbl">처방 기간</div>'
    +       '<input class="f-input" oninput="onFinal(\'period\',this.value)" placeholder="예: 반제(15일)" value="' + esc(finalForm.period) + '"></div>'
    +     '<div class="final-box"><div class="fb-lbl">재진 시점</div>'
    +       '<input class="f-input" oninput="onFinal(\'revisit\',this.value)" placeholder="예: D+7, D+15" value="' + esc(finalForm.revisit) + '"></div>'
    +   '</div>'
    +   '<div class="fb-lbl" style="margin-bottom:5px">처방 의도 · 환자 설명 · 다음 단계 메모</div>'
    +   '<textarea class="f-area" rows="3" oninput="onFinal(\'note\',this.value)" '
    +     'placeholder="처방 의도 · 환자 설명 사항 · 다음 단계 계획...">' + esc(finalForm.note) + '</textarea>'
    +   caveat()
    +   (confirmed ? '<div class="status-box done">처방 확정·저장됨 — onnuri_session.moduleE</div>' : '')
    +   '<div class="actions no-print">'
    +     '<button class="btn btn-dark" onclick="confirmRx()"' + (finalForm.prescription.trim()?'':' disabled') + '>처방 확정 · 차트 저장</button>'
    +     '<button class="btn btn-line" onclick="printResult()">결과 인쇄</button>'
    +     '<button class="btn btn-line" onclick="backToRecommend()">← 추천으로 돌아가기</button>'
    +   '</div>'
    + '</div>'
    + footer();
}

/* ── 이벤트 핸들러 ── */
function startRecommend(){
  if (!profile){
    const c = document.getElementById('sel-const');
    const h = document.getElementById('sel-hanyul');
    const y = document.getElementById('sel-yangyin');
    const cv = c ? c.value : '', hv = h ? h.value : '';
    if (!cv || !hv){ alert('체질과 한열을 선택하세요.'); return; }
    profile = { constitution:cv, hanyul:hv, yangyin:(y?y.value:'none') || 'none' };
  }
  step = 1;
  render();
}
function onChipToggle(sym){
  const i = chiefComplaints.indexOf(sym);
  if (i >= 0) chiefComplaints.splice(i, 1);
  else chiefComplaints.push(sym);
  render();
}
function onFreeText(v){ freeText = v; }
function onSearch(v){ searchQuery = v; render(); }
function onCustomSymInput(v){ customSym = v; }
function addCustomSym(){
  const v = (customSym || '').trim();
  if (!v) return;
  if (chiefComplaints.indexOf(v) < 0) chiefComplaints.push(v);
  customSym = '';
  render();
}
function onCustomSymKey(e){
  if (e && e.key === 'Enter'){
    if (e.preventDefault) e.preventDefault();
    addCustomSym();
  }
}
function searchRx(){ searched = true; render(); window.scrollTo({top: document.body.scrollHeight*0.4, behavior:'smooth'}); }
function toggleGamga(rxId, idx){
  if (!selectedGamga[rxId]) selectedGamga[rxId] = [];
  const i = selectedGamga[rxId].indexOf(idx);
  if (i >= 0) selectedGamga[rxId].splice(i, 1);
  else selectedGamga[rxId].push(idx);
  render();
}
function selectRx(id){
  chosenRx = null;
  if (id){
    // 1) 큐레이션 8종에서 찾기 (id 기반)
    chosenRx = RX_CURATED.filter(function(r){ return r.id===id; })[0] || null;
    // 2) 없으면 RX_FULL에서 류주열 코드로 찾기
    if (!chosenRx){
      const rxFull = RX_FULL.filter(function(r){ return r.code===id; })[0];
      if (rxFull){
        chosenRx = {
          id: rxFull.code,
          name: rxFull.name,
          composition: rxFull.composition,
          ryuCode: rxFull.code,
          source: '류주열 사상처방개정판 ' + rxFull.code,
          gamga: []
        };
      }
    }
  }
  if (chosenRx){
    const sel = (selectedGamga[id] || []).slice().sort(function(a,b){return a-b;});
    const gamgaList = sel.map(function(i){ return chosenRx.gamga && chosenRx.gamga[i]; }).filter(Boolean);
    finalForm.prescription = chosenRx.name
      + (chosenRx.composition ? ' — ' + chosenRx.composition : '')
      + (gamgaList.length ? '\n[가감] ' + gamgaList.join(' / ') : '');
  }
  confirmed = false;
  step = 2;
  render();
}
function onFinal(field, v){ finalForm[field] = v; }
function confirmRx(){
  if (!finalForm.prescription.trim()) return;
  saveSession();
  confirmed = true;
  render();
}
function backToInfo(){ step = 0; render(); }
function backToRecommend(){ step = 1; render(); }
function printResult(){ window.print(); }
function goToModuleD(){ location.href = '온누리_기능검사_D_v1.html'; }
function onBjSearch(v){ bjQuery = v; render(); }
function onBjToggle(key){ bjOpen = (bjOpen===key ? '' : key); render(); }
function pickRxByCode(code){
  const r = RX_FULL.filter(function(x){ return x.code===code; })[0];
  if (!r){ alert('처방 정보를 찾을 수 없습니다: ' + code); return; }
  chosenRx = { name:r.name, hanja:'', composition:r.composition||'' };
  finalForm.prescription = r.name
    + (r.composition ? ' — ' + r.composition : '')
    + '  [류주열 ' + code + ']';
  confirmed = false;
  step = 2;
  render();
}

/* ── 렌더 ── */
function render(){
  const screens = [renderInfo, renderRecommend, renderFinal];
  if (step < 0 || step > 2) step = 0;
  if ((step === 1 || step === 2) && !profile){ step = 0; }
  document.getElementById('wrap').innerHTML = screens[step]();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ── 진입점 ── */
loadSession();
render();
</script>
