<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>온누리한의원 배너 다운로드</title>
<style>
body { font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; padding: 30px; background: #f0eee5; min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; }
h1 { color: #2d5a3d; font-size: 22px; margin: 0 0 8px; }
.help { background: #fff8e7; border-left: 4px solid #b8860b; padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; line-height: 1.7; font-size: 14px; color: #2c2416; }
.help strong { color: #2d5a3d; }
.banner-wrap { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 16px; }
.banner-wrap svg { width: 100%; height: auto; display: block; max-width: 600px; margin: 0 auto; }
.note { font-size: 13px; color: #6b5d4a; text-align: center; margin: 12px 0; }
.btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
.btn { background: #2d5a3d; color: white; border: none; padding: 14px 28px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.18s; }
.btn:hover { background: #1e3d29; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(45,90,61,0.3); }
.btn.jpg { background: #b8860b; }
.btn.jpg:hover { background: #96700a; }
.btn.svg { background: #4a7c59; }
.btn.svg:hover { background: #3d6649; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e3d29; color: white; padding: 14px 24px; border-radius: 30px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h1>🏥 온누리한의원 공식 홈페이지 안내 배너</h1>
<div class="help">
<strong>📐 정사각형 디자인 (1080 × 1080):</strong> 네이버 블로그 대표이미지 자동 크롭에 안전한 비율<br>
<strong>📥 사용법:</strong> 아래 다운로드 버튼 클릭 → 다운로드 폴더에 저장 → 네이버 블로그 글에 첨부
</div>

<div class="banner-wrap">

<text x="340" y="430" font-family="'Nanum Myeongjo', 'Batang', serif" font-size="320" fill="#b8860b" opacity="0.05" text-anchor="middle" font-weight="700">韓</text>
<g transform="translate(340, 110)">
<circle cx="0" cy="0" r="55" fill="#f5efe2" stroke="#2d5a3d" stroke-width="2"/>
<circle cx="0" cy="0" r="48" fill="none" stroke="#b8860b" stroke-width="0.6" opacity="0.5"/>
<g transform="translate(0,-25)">
<path d="M-20,9 C-25,-2 -11,-13 -2,-7 C-4,-15 7,-15 9,-5 C18,-13 28,-2 20,7 C13,13 -8,15 -20,9 Z" fill="#4a7c59"/>
<path d="M-13,4 Q-6,-2 0,-4" stroke="#1e3d29" stroke-width="0.8" fill="none"/>
<path d="M0,-4 Q7,-2 13,4" stroke="#1e3d29" stroke-width="0.8" fill="none"/>
<path d="M-2,-7 L-2,9" stroke="#1e3d29" stroke-width="0.6" fill="none"/>
</g>
<text x="0" y="8" text-anchor="middle" font-family="'Nanum Myeongjo', 'Batang', serif" font-size="14" fill="#1e3d29" font-weight="700">온누리</text>
<text x="0" y="26" text-anchor="middle" font-family="'Malgun Gothic', sans-serif" font-size="7" fill="#6b5d4a" letter-spacing="2" font-weight="500">ORIENTAL MEDICINE</text>
</g>
<text x="340" y="225" text-anchor="middle" font-family="'Nanum Myeongjo', 'Batang', 'Noto Serif KR', serif" font-size="46" fill="#1e3d29" font-weight="700">온누리한의원</text>
<line x1="280" y1="245" x2="400" y2="245" stroke="#b8860b" stroke-width="1.2"/>
<circle cx="340" cy="245" r="3" fill="#b8860b"/>
<text x="340" y="272" text-anchor="middle" font-family="'Malgun Gothic', sans-serif" font-size="12" fill="#6b5d4a" letter-spacing="3.5" font-weight="500">수원 권선동 · 30년 임상</text>
<g transform="translate(110, 305)">

<circle cx="22" cy="21" r="7" fill="#4a7c59"/>
<text x="22" y="25" text-anchor="middle" font-family="'Malgun Gothic', sans-serif" font-size="10" fill="#ffffff" font-weight="700">AI</text>
<text x="105" y="26" text-anchor="middle" font-family="'Malgun Gothic', sans-serif" font-size="14" fill="#1e3d29" font-weight="500">한방 상담 가능</text>
</g>
<g transform="translate(390, 305)">
<rect x="0" y="0" width="180" height="42" fill="#ffffff" stroke="#03c75a" stroke-width="1.2" rx="21"/>
<circle cx="22" cy="21" r="9" fill="#03c75a"/>
<text x="22" y="25" text-anchor="middle" font-family="'Malgun Gothic', sans-serif" font-size="11" fill="#ffffff" font-weight="700">N</text>
<text x="108" y="26" text-anchor="middle" font-family="'Malgun Gothic', sans-serif" font-size="14" fill="#1e3d29" font-weight="500">네이버 예약 가능</text>
</g>
<g transform="translate(250, 365)">
<rect x="0" y="0" width="180" height="42" fill="#ffffff" stroke="#b8860b" stroke-width="1.2" rx="21"/>
<text x="22" y="28" text-anchor="middle" font-family="'Nanum Myeongjo', 'Batang', serif" font-size="16" fill="#b8860b" font-weight="700">道</text>
<text x="108" y="26" text-anchor="middle" font-family="'Malgun Gothic', sans-serif" font-size="14" fill="#1e3d29" font-weight="500">진심을 담은 진료</text>

<rect x="100" y="445" width="480" height="100" fill="#2d5a3d" rx="16"/>

<text x="340" y="518" text-anchor="middle" font-family="'Nanum Myeongjo', 'Batang', 'Noto Serif KR', serif" font-size="32" fill="#ffffff" font-weight="700">onnuriclinic.com</text>
<g transform="translate(150, 590)">
<path d="M0,2 C0,1 1,0 2,0 L4,0 L5,2 L4,3 L3,5 C5,7 7,9 9,10 L11,9 L12,8 L14,8 C15,8 16,9 16,10 C16,12 14,14 12,14 C7,14 0,7 0,2 Z" fill="#2d5a3d"/>
</g>
<text x="172" y="601" font-family="'Malgun Gothic', sans-serif" font-size="13" fill="#2c2416" font-weight="500">031-223-1075</text>
<text x="280" y="601" font-family="'Malgun Gothic', sans-serif" font-size="13" fill="#6b5d4a">·  경기 수원시 권선구 덕영대로1201번길 8 (3층)</text>
<text x="340" y="635" text-anchor="middle" font-family="'Malgun Gothic', sans-serif" font-size="10" fill="#6b5d4a" letter-spacing="2" opacity="0.7">ONNURI ORIENTAL MEDICINE  ·  SUWON</text>
</svg>
</div>

<div class="btn-row">
<button class="btn jpg" onclick="downloadAs('jpeg')">📥 JPG 다운로드 (블로그 추천)</button>
<button class="btn" onclick="downloadAs('png')">📥 PNG 다운로드</button>
<button class="btn svg" onclick="downloadSVG()">📥 SVG 다운로드</button>
</div>

<div class="note">📐 1080 × 1080 픽셀 정사각형 · 모든 정보가 잘리지 않고 표시됨</div>
</div>

<div id="toast" class="toast"></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function downloadAs(format) {
  const svg = document.getElementById('banner');
  const svgData = new XMLSerializer().serializeToString(svg);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const targetSize = 1080;
  canvas.width = targetSize;
  canvas.height = targetSize;

  if (format === 'jpeg') {
    ctx.fillStyle = '#faf6ef';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const img = new Image();
  const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);

  img.onload = function() {
    ctx.drawImage(img, 0, 0, targetSize, targetSize);
    URL.revokeObjectURL(url);
    const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
    const ext = format === 'jpeg' ? 'jpg' : 'png';
    const quality = format === 'jpeg' ? 0.95 : undefined;
    canvas.toBlob(function(blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'onnuriclinic-banner-square.' + ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast(ext.toUpperCase() + ' 파일이 다운로드되었습니다');
    }, mime, quality);
  };

  img.onerror = function() {
    showToast('변환 실패. 페이지를 새로고침 후 다시 시도해주세요.');
  };

  img.src = url;
}

function downloadSVG() {
  const svg = document.getElementById('banner');
  const svgData = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'onnuriclinic-banner-square.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('SVG 파일이 다운로드되었습니다');
}
</script>
</body>
</html>
