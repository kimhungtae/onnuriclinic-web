<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온누리 한의원 — 사상체질 감별</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ty:#8B1A1A; --te:#1A4A2E; --sy:#A04000; --se:#1A3A6B;
  --ty-l:#fdf0f0; --te-l:#edf7f1; --sy-l:#fef3e6; --se-l:#eaeff8;
  --ty-m:#c02828; --te-m:#276b45; --sy-m:#c4580d; --se-m:#2a5bb8;
  --gold:#7a5c00; --gold-l:#fef9e6;
  --bg:#fdfcf8; --bg2:#f5f3ed; --bg3:#ede9df;
  --txt:#1a1815; --txt2:#6b6560; --txt3:#9c9590;
  --border:#d8d3c8; --border2:#c8c3b8;
  --serif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',sans-serif;
  --radius:12px; --radius-sm:8px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --shadow-md:0 4px 24px rgba(0,0,0,.10);
}
html{font-size:16px;}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.6;}

/* ── 레이아웃 ── */
.wrap{max-width:680px;margin:0 auto;padding:0 1rem 3rem;}
.screen{display:none;animation:fadeUp .3s ease;}
.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ── 헤더 ── */
.site-header{padding:2rem 1rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);margin-bottom:2rem;}
.clinic-name{font-family:var(--serif);font-size:.75rem;letter-spacing:.2em;color:var(--txt3);margin-bottom:.5rem;}
.site-title{font-family:var(--serif);font-size:1.6rem;font-weight:600;color:var(--txt);}
.site-hanja{font-size:.8rem;color:var(--txt3);margin-top:.3rem;letter-spacing:.1em;}
.type-pills{display:flex;justify-content:center;gap:6px;margin-top:1rem;flex-wrap:wrap;}
.pill{padding:3px 12px;border-radius:100px;font-size:.7rem;font-weight:500;font-family:var(--serif);}
.pill-ty{background:var(--ty-l);color:var(--ty);border:1px solid var(--ty);}
.pill-te{background:var(--te-l);color:var(--te);border:1px solid var(--te);}
.pill-sy{background:var(--sy-l);color:var(--sy);border:1px solid var(--sy);}
.pill-se{background:var(--se-l);color:var(--se);border:1px solid var(--se);}

/* ── 진행 바 ── */
.progress-wrap{margin-bottom:2rem;}
.progress-meta{display:flex;justify-content:space-between;font-size:.7rem;color:var(--txt3);margin-bottom:.4rem;}
.progress-track{height:3px;background:var(--bg3);border-radius:2px;}
.progress-fill{height:3px;background:var(--te);border-radius:2px;transition:width .4s ease;}

/* ── 섹션 타이틀 ── */
.sec-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;font-size:.65rem;font-weight:500;letter-spacing:.08em;margin-bottom:1rem;}
.sec-badge.body{background:var(--bg3);color:var(--txt2);}
.sec-badge.physio{background:#e8f0fe;color:#1a3a8a;}
.sec-badge.char{background:#e8f7ef;color:#1a4a2e;}
.sec-badge.emo{background:#fceee8;color:#8a2a1a;}
.sec-badge.food{background:var(--gold-l);color:var(--gold);}
.sec-badge.ox{background:#f0eef8;color:#4a2a7a;}
.step-title{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin-bottom:.3rem;}
.step-sub{font-size:.8rem;color:var(--txt2);margin-bottom:1.75rem;}

/* ── 정보 입력 ── */
.info-grid{display:grid;grid-template-columns:1fr 90px 90px;gap:10px;margin-bottom:1.5rem;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:.7rem;font-weight:500;color:var(--txt2);letter-spacing:.04em;}
.field input,.field select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--txt);font-family:var(--sans);font-size:.875rem;transition:border-color .15s;}
.field input:focus,.field select:focus{outline:none;border-color:var(--te);}

/* ── 4선택 문항 ── */
.q-block{margin-bottom:1.5rem;}
.q-label{font-size:.65rem;font-weight:500;color:var(--txt3);letter-spacing:.06em;margin-bottom:.4rem;}
.q-text{font-size:.95rem;font-weight:500;margin-bottom:.9rem;line-height:1.5;}
.opts{display:grid;gap:7px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;cursor:pointer;transition:all .15s;text-align:left;}
.opt:hover{border-color:var(--te);background:var(--te-l);}
.opt.sel-ty{border-color:var(--ty);background:var(--ty-l);color:var(--ty);}
.opt.sel-te{border-color:var(--te);background:var(--te-l);color:var(--te);}
.opt.sel-sy{border-color:var(--sy);background:var(--sy-l);color:var(--sy);}
.opt.sel-se{border-color:var(--se);background:var(--se-l);color:var(--se);}
.opt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.dot-ty{background:var(--ty);}
.dot-te{background:var(--te);}
.dot-sy{background:var(--sy);}
.dot-se{background:var(--se);}
.opt-text{font-size:.875rem;line-height:1.5;}

/* ── OX 문항 ── */
.ox-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.ox-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;}
.ox-num{font-size:.7rem;font-weight:600;color:var(--txt3);flex-shrink:0;width:20px;}
.ox-text{flex:1;font-size:.875rem;line-height:1.4;}
.ox-btns{display:flex;gap:5px;flex-shrink:0;}
.ox-btn{padding:5px 13px;border:1px solid var(--border);border-radius:100px;background:#fff;color:var(--txt2);font-size:.75rem;font-family:var(--sans);cursor:pointer;transition:all .15s;}
.ox-btn:hover{border-color:var(--te);}
.ox-btn.yes.act{background:var(--te-l);color:var(--te);border-color:var(--te);font-weight:500;}
.ox-btn.no.act{background:var(--bg3);color:var(--txt2);border-color:var(--border2);font-weight:500;}
.ox-btn.unk.act{background:#fef9e6;color:#7A5C00;border-color:#d4c280;font-weight:500;}

/* ── v21: 양극단 응답 (PART 1, 6) ── */
.bip-list{display:flex;flex-direction:column;gap:9px;}
.bip-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;}
.bip-row.has-yes{border-color:var(--te);background:var(--te-l);}
.bip-row.has-no{border-color:var(--border2);background:var(--bg3);opacity:.65;}
.bip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.bip-text{flex:1;font-size:.875rem;line-height:1.5;color:var(--txt1);}
.bip-btns{display:flex;gap:5px;flex-shrink:0;}
.bip-btn{padding:5px 12px;border:1px solid var(--border);border-radius:100px;background:#fff;color:var(--txt2);font-size:.72rem;font-family:var(--sans);cursor:pointer;transition:all .15s;white-space:nowrap;}
.bip-btn:hover{border-color:var(--te);}
.bip-btn.yes.act{background:var(--te);color:#fff;border-color:var(--te);font-weight:500;}
.bip-btn.no.act{background:var(--ty);color:#fff;border-color:var(--ty);font-weight:500;}

/* ── v21: 4지선다 "잘 모르겠음" 버튼 ── */
.opt-unknown{display:flex;align-items:center;justify-content:center;padding:9px 14px;margin-top:6px;border:1px dashed var(--border2);border-radius:var(--radius-sm);background:#fafaf7;color:var(--txt3);font-size:.78rem;cursor:pointer;transition:all .15s;}
.opt-unknown:hover{border-color:#d4c280;background:#fef9e6;color:#7A5C00;}
.opt-unknown.act{background:#fef9e6;color:#7A5C00;border-style:solid;border-color:#d4c280;font-weight:500;}

/* ── v21: 작성 안내 강조 ── */
.fill-hint{padding:10px 13px;background:#fef9e6;border:1px solid #d4c280;border-left:3px solid #7A5C00;border-radius:var(--radius-sm);font-size:.78rem;color:#5C4A1E;line-height:1.55;margin-bottom:.875rem;}
.fill-hint b{color:#7A5C00;}

/* ── v23: 중간 점검 화면 ── */
.check-hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius);margin-bottom:1rem;border:1.5px solid;}
.check-hero-ic{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.3rem;color:#fff;flex-shrink:0;}
.check-hero-lbl{font-size:.7rem;letter-spacing:.06em;margin-bottom:3px;}
.check-hero-nm{font-family:var(--serif);font-size:1.3rem;font-weight:600;}
.check-hero-meta{font-size:.72rem;color:var(--txt2);margin-top:3px;}
.check-info{padding:10px 13px;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--te);border-radius:var(--radius-sm);font-size:.78rem;color:var(--txt2);line-height:1.55;margin:1rem 0 1.5rem;}
.check-info b{color:var(--te);}
.check-delta{display:inline-block;padding:1px 8px;border-radius:100px;font-size:.7rem;margin-left:6px;background:var(--bg3);color:var(--txt2);font-weight:500;}
.check-delta.up{background:var(--te-l);color:var(--te);}
.check-delta.down{background:var(--ty-l);color:var(--ty);}
.check-delta.same{background:var(--bg3);color:var(--txt3);}
.check-cmp-grid{display:grid;grid-template-columns:50px repeat(4,1fr);gap:4px 6px;font-size:.75rem;padding:10px;background:var(--bg2);border-radius:var(--radius-sm);margin-bottom:1rem;}
.check-cmp-hdr{font-size:.65rem;color:var(--txt3);text-align:center;letter-spacing:.04em;padding-bottom:4px;border-bottom:1px solid var(--border);font-weight:500;}
.check-cmp-hdr.first{text-align:left;}
.check-cmp-nm{font-size:.7rem;font-weight:600;color:var(--txt2);}
.check-cmp-c{text-align:center;padding:3px;border-radius:4px;background:#fff;font-variant-numeric:tabular-nums;}
.check-cmp-c.dom{font-weight:700;outline:1px solid currentColor;}
.btn-skip{padding:10px 22px;border-radius:var(--radius-sm);font-size:.875rem;font-family:var(--sans);font-weight:500;cursor:pointer;border:1px dashed var(--border2);background:#fff;color:var(--txt3);transition:all .15s;}
.btn-skip:hover{border-color:var(--gold);background:var(--gold-l);color:var(--gold);border-style:solid;}

/* ── v23: 확정 문항 화면 ── */
.killer-list{display:flex;flex-direction:column;gap:12px;margin-bottom:1rem;}
.killer-card{padding:14px 16px;border:1.5px solid;border-radius:var(--radius);background:#fff;display:flex;flex-direction:column;gap:10px;transition:all .15s;}
.killer-card.ty{border-color:rgba(139,26,26,.35);}
.killer-card.te{border-color:rgba(26,74,46,.35);}
.killer-card.sy{border-color:rgba(160,64,0,.35);}
.killer-card.se{border-color:rgba(26,58,107,.35);}
.killer-card.has-yes{box-shadow:0 4px 16px rgba(0,0,0,.08);}
.killer-card.ty.has-yes{border-color:var(--ty);background:var(--ty-l);}
.killer-card.te.has-yes{border-color:var(--te);background:var(--te-l);}
.killer-card.sy.has-yes{border-color:var(--sy);background:var(--sy-l);}
.killer-card.se.has-yes{border-color:var(--se);background:var(--se-l);}
.killer-head{display:flex;align-items:center;gap:10px;}
.killer-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:100px;font-size:.7rem;font-weight:600;font-family:var(--serif);color:#fff;flex-shrink:0;}
.killer-badge.ty{background:var(--ty);}
.killer-badge.te{background:var(--te);}
.killer-badge.sy{background:var(--sy);}
.killer-badge.se{background:var(--se);}
.killer-tag{font-size:.7rem;color:var(--txt3);letter-spacing:.04em;}
.killer-text{font-size:.92rem;font-weight:500;line-height:1.55;color:var(--txt);}
.killer-btns{display:flex;gap:7px;}
.killer-btn{flex:1;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--txt2);font-size:.85rem;font-family:var(--sans);cursor:pointer;font-weight:500;transition:all .15s;}
.killer-btn:hover{border-color:var(--txt2);}
.killer-btn.yes.act.ty{background:var(--ty);color:#fff;border-color:var(--ty);}
.killer-btn.yes.act.te{background:var(--te);color:#fff;border-color:var(--te);}
.killer-btn.yes.act.sy{background:var(--sy);color:#fff;border-color:var(--sy);}
.killer-btn.yes.act.se{background:var(--se);color:#fff;border-color:var(--se);}
.killer-btn.no.act{background:var(--bg3);color:var(--txt2);border-color:var(--border2);}

/* ── 음식 ── */
.food-section{margin-bottom:1.25rem;}
.food-head{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--radius-sm);margin-bottom:8px;font-size:.8rem;font-weight:500;}
.food-head.ty{background:var(--ty-l);color:var(--ty);}
.food-head.te{background:var(--te-l);color:var(--te);}
.food-head.sy{background:var(--sy-l);color:var(--sy);}
.food-head.se{background:var(--se-l);color:var(--se);}
.food-chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 11px;border:1px solid var(--border);border-radius:100px;font-size:.75rem;cursor:pointer;background:#fff;color:var(--txt);transition:all .15s;}
.chip:hover{border-color:var(--te);}
.chip.sel-ty{background:var(--ty-l);color:var(--ty);border-color:var(--ty);}
.chip.sel-te{background:var(--te-l);color:var(--te);border-color:var(--te);}
.chip.sel-sy{background:var(--sy-l);color:var(--sy);border-color:var(--sy);}
.chip.sel-se{background:var(--se-l);color:var(--se);border-color:var(--se);}

/* ── 네비 ── */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border);}
.btn{padding:10px 22px;border-radius:var(--radius-sm);font-size:.875rem;font-family:var(--sans);font-weight:500;cursor:pointer;transition:all .15s;}
.btn-outline{border:1px solid var(--border);background:#fff;color:var(--txt2);}
.btn-outline:hover{background:var(--bg2);border-color:var(--border2);}
.btn-primary{border:none;background:var(--te);color:#fff;}
.btn-primary:hover{background:#1f5c36;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-ty{background:var(--ty);color:#fff;border:none;}
.btn-ty:hover{background:var(--ty-m);}

/* ── 결과 ── */
.result-hero{display:flex;align-items:center;gap:16px;padding:1.5rem;border-radius:var(--radius);margin-bottom:1.5rem;position:relative;overflow:hidden;}
.result-hero::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;opacity:.15;}
.hero-ty{background:var(--ty-l);border:1.5px solid var(--ty);}
.hero-ty::before{background:var(--ty);}
.hero-te{background:var(--te-l);border:1.5px solid var(--te);}
.hero-te::before{background:var(--te);}
.hero-sy{background:var(--sy-l);border:1.5px solid var(--sy);}
.hero-sy::before{background:var(--sy);}
.hero-se{background:var(--se-l);border:1.5px solid var(--se);}
.hero-se::before{background:var(--se);}
.hero-icon{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.5rem;color:#fff;flex-shrink:0;position:relative;z-index:1;}
.hero-body{position:relative;z-index:1;}
.hero-label{font-size:.7rem;font-weight:500;letter-spacing:.06em;margin-bottom:3px;}
.hero-name{font-family:var(--serif);font-size:1.6rem;font-weight:600;}
.hero-hanja{font-size:.8rem;margin-top:2px;opacity:.7;}
.hero-organ{font-size:.75rem;margin-top:4px;font-family:var(--serif);}

.score-section{margin-bottom:1.5rem;}
.score-title{font-size:.7rem;font-weight:500;color:var(--txt2);letter-spacing:.06em;margin-bottom:.75rem;}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.score-name{width:72px;font-size:.8rem;text-align:right;flex-shrink:0;}
.score-track{flex:1;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;}
.score-fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.fill-ty{background:var(--ty);}
.fill-te{background:var(--te);}
.fill-sy{background:var(--sy);}
.fill-se{background:var(--se);}
.score-pct{width:32px;font-size:.75rem;color:var(--txt2);text-align:right;}
.score-check{font-size:.9rem;}

/* ── 탭 ── */
.tabs{display:flex;gap:4px;margin-bottom:1rem;flex-wrap:wrap;}
.tab{padding:6px 14px;border:1px solid var(--border);border-radius:100px;font-size:.75rem;cursor:pointer;background:#fff;color:var(--txt2);transition:all .15s;}
.tab.act{border-color:var(--txt);background:var(--txt);color:#fff;}
.tab-panel{display:none;}
.tab-panel.act{display:block;}

.info-card{padding:1rem 1.25rem;border:1px solid var(--border);border-radius:var(--radius);background:#fff;margin-bottom:10px;}
.info-card-title{font-size:.7rem;font-weight:500;color:var(--txt2);letter-spacing:.05em;margin-bottom:.6rem;display:flex;align-items:center;gap:5px;}
.info-list{list-style:none;}
.info-list li{font-size:.875rem;line-height:1.6;padding:2px 0;display:flex;gap:8px;}
.info-list li::before{content:"·";color:var(--txt3);}
.tag{display:inline-block;padding:2px 8px;border-radius:100px;font-size:.65rem;font-weight:500;margin-right:4px;}
.tag-good{background:var(--te-l);color:var(--te);}
.tag-bad{background:var(--ty-l);color:var(--ty);}
.tag-rx{background:var(--gold-l);color:var(--gold);}

/* ── 원장 메모 ── */
.clinic-box{margin-top:1.5rem;padding:1.25rem;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--border);}
.clinic-box-title{font-size:.7rem;font-weight:500;color:var(--txt2);letter-spacing:.05em;margin-bottom:1rem;display:flex;align-items:center;gap:5px;}
.clinic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.clinic-item{padding:10px 12px;border-radius:var(--radius-sm);background:#fff;border:1px solid var(--border);}
.cli-label{font-size:.65rem;color:var(--txt3);margin-bottom:4px;}
.cli-val{font-size:.8rem;font-weight:500;line-height:1.5;}
.warn-box{margin-top:.75rem;padding:8px 12px;border-radius:var(--radius-sm);background:var(--ty-l);color:var(--ty);font-size:.75rem;border:1px solid var(--ty);display:flex;align-items:flex-start;gap:6px;}
.judge-row{display:flex;align-items:center;gap:8px;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);}
.judge-label{font-size:.75rem;font-weight:500;flex-shrink:0;}
.judge-opts{display:flex;gap:5px;flex-wrap:wrap;}
.judge-btn{padding:4px 12px;border:1px solid var(--border);border-radius:100px;font-size:.75rem;background:#fff;cursor:pointer;transition:all .15s;}
.judge-btn:hover{border-color:var(--te);}
.judge-btn.sel-ty{background:var(--ty-l);color:var(--ty);border-color:var(--ty);font-weight:500;}
.judge-btn.sel-te{background:var(--te-l);color:var(--te);border-color:var(--te);font-weight:500;}
.judge-btn.sel-sy{background:var(--sy-l);color:var(--sy);border-color:var(--sy);font-weight:500;}
.judge-btn.sel-se{background:var(--se-l);color:var(--se);border-color:var(--se);font-weight:500;}
.judge-btn.sel-hold{background:var(--bg3);color:var(--txt2);border-color:var(--border2);font-weight:500;}
textarea.memo{width:100%;margin-top:.6rem;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--sans);font-size:.8rem;color:var(--txt);background:#fff;resize:vertical;min-height:60px;}
textarea.memo:focus{outline:none;border-color:var(--te);}

/* ── 액션 버튼 ── */
.actions{display:flex;gap:8px;margin-top:1.5rem;flex-wrap:wrap;}
.btn-print{padding:9px 18px;border:1px solid var(--te);background:var(--te-l);color:var(--te);border-radius:var(--radius-sm);font-size:.8rem;font-family:var(--sans);cursor:pointer;font-weight:500;}
.btn-print:hover{background:var(--te);color:#fff;}

// 응답 여부: q.opts 중 하나 이상에 yes 또는 no 표시되면 응답으로 간주
function bipAnswered(q){
  const a = bipAns[q.id] || {};
  return q.opts.some(o => a[o.v]==='yes' || a[o.v]==='no');
}

function allAnswered(qs){return qs.every(q=>ans[q.id]);}
function allAnsweredOrUnknown(qs){return qs.every(q=>ans[q.id]);}  // 'unknown'도 포함됨
function allOxAnswered(){return Q_OX.every(q=>oxAns[q.id]!==undefined);}

/* ═══════════════════════════════════════════════════
   점수 계산 (v21 — Hybrid 응답 방식 · v23 stage 분리)
   · stage 1: 체형(±3) + 생리(+2) + OX (1차 중간 점검용)
   · stage 2: + 성격·심리(+2) (2차 중간 점검용)
   · stage 미지정/3: + 음식(±3) + 확정문항(+5) (최종)
═══════════════════════════════════════════════════ */
// 인구분포 기반 사전확률 (안준철: 태양인 평생 3명, 결과지 note의 0.1%)
const PRIOR = {ty:0.001, te:0.50, sy:0.25, se:0.249};

function calcScores(stage){
  const isStage1 = stage === 1;
  const isStage2 = stage === 2;
  const isFinal  = !stage || stage >= 3;

  const sc={ty:0,te:0,sy:0,se:0};
  const hanyul={cold:0,hot:0};
  const hanyul_sy={cold:0,hot:0};
  let answered=0, total=0;

  // PART 1 체형 (모든 stage)
  Q_BODY.forEach(q=>{
    total++;
    if(!bipAnswered(q)) return;
    answered++;
    const a = bipAns[q.id] || {};
    q.opts.forEach(o=>{
      if(a[o.v]==='yes') sc[o.v]+=3;
      else if(a[o.v]==='no') sc[o.v]-=3;
    });
  });

  // PART 6 음식 (final만)
  if(isFinal){
    Q_FOOD.forEach(q=>{
      total++;
      if(!bipAnswered(q)) return;
      answered++;
      const a = bipAns[q.id] || {};
      q.opts.forEach(o=>{
        if(a[o.v]==='yes') sc[o.v]+=3;
        else if(a[o.v]==='no') sc[o.v]-=3;
      });
    });
  }

  // PART 2 생리 (모든 stage)
  Q_PHYSIO.forEach(q=>{
    total++;
    const v = ans[q.id];
    if(!v) return;
    if(v==='unknown'){ answered++; return; }
    answered++;
    if(sc[v]!==undefined) sc[v]+=2;
  });

  // PART 4·5 성격·심리 (stage 2 이상)
  if(isStage2 || isFinal){
    [...Q_CHAR, ...Q_EMO].forEach(q=>{
      total++;
      const v = ans[q.id];
      if(!v) return;
      if(v==='unknown'){ answered++; return; }
      answered++;
      if(sc[v]!==undefined) sc[v]+=2;
    });
  }

  // PART 3 OX (모든 stage)
  Q_OX.forEach(q=>{
    total++;
    const v = oxAns[q.id];
    if(v===undefined) return;
    if(v==='unknown'){ answered++; return; }
    answered++;
    const eff = v==='yes' ? q.yes : q.no;
    if(!eff) return;
    Object.entries(eff).forEach(([key,val])=>{
      if(key==='hanyul')        hanyul[val]+=1;
      else if(key==='hanyul_sy') hanyul_sy[val]+=1;
      else if(sc[key]!==undefined) sc[key]+=val;
    });
  });

  // v23: 확정 문항 (final만, "예"=확정+5, "아니오"=0)
  if(isFinal){
    Q_KILLER.forEach(q=>{
      total++;
      const v = killerAns[q.id];
      if(v===undefined) return;
      answered++;
      if(v==='yes') sc[q.confirm]+=5;
    });
  }

  // 음수 클리핑 (이후 prior 보정을 위해 0 이상으로)
  const scClipped = {};
  TYPES.forEach(t => { scClipped[t] = Math.max(0, sc[t]); });

  const coverage = total > 0 ? answered/total : 0;
  return {sc: scClipped, scRaw: sc, hanyul, hanyul_sy, coverage, answered, total};
}

// v23: stage별 prior-보정된 % 분포 + 1위 체질 계산 (스냅샷·결과지 추이 비교용)
function calcStageResult(stage){
  const c = calcScores(stage);
  const adjPcts = applyPrior(c.sc);
  const rounded = {};
  TYPES.forEach(t => rounded[t] = Math.round(adjPcts[t]));
  const diff = 100 - TYPES.reduce((s,t)=>s+rounded[t],0);
  if(diff !== 0){
    const big = TYPES.reduce((a,b)=>rounded[a]>=rounded[b]?a:b);
    rounded[big] += diff;
  }
  const top = topType(adjPcts);
  return {sc:c.sc, pcts:rounded, top, coverage:c.coverage, answered:c.answered, total:c.total};
}

// Prior 보정: raw 점수 분포에 인구비를 곱한 뒤 정규화
function applyPrior(raw){
  const total = TYPES.reduce((s,t)=>s+raw[t],0)||1;
  const adj={};
  TYPES.forEach(t=>{ adj[t]=(raw[t]/total)*PRIOR[t]; });
  const sum = TYPES.reduce((s,t)=>s+adj[t],0)||1;
  TYPES.forEach(t=>{ adj[t]=adj[t]/sum*100; });
  return adj;
}

function topType(sc){
  return TYPES.reduce((a,b)=>sc[a]>=sc[b]?a:b);
}
function totalScore(sc){return TYPES.reduce((s,t)=>s+sc[t],0);}

// 한열 판정: 소양인은 가스(ox3)만 기준, 그 외는 대변+커피
function determineHanyul(top, hanyul, hanyul_sy){
  if(top==='sy'){
    if(hanyul_sy.cold > hanyul_sy.hot) return 'cold';
    if(hanyul_sy.hot > hanyul_sy.cold) return 'hot';
    return 'mixed';
  }
  if(hanyul.cold > hanyul.hot) return 'cold';
  if(hanyul.hot > hanyul.cold) return 'hot';
  return 'mixed';
}
const HANYUL_LABEL = {cold:'寒者 (한자)', hot:'熱者 (열자)', mixed:'한열 혼재 (추가 면담)'};

// 1-2등 격차 + 응답 커버리지 기반 신뢰도
function calcConfidence(pcts, coverage){
  const sorted = TYPES.map(t=>({t,p:pcts[t]})).sort((a,b)=>b.p-a.p);
  const top1=sorted[0].p, top2=sorted[1].p, margin=top1-top2;
  const covPct = Math.round((coverage||0)*100);
  // 응답률이 너무 낮으면 격차 무관하게 낮음
  if(covPct < 50) return {level:'낮음 (응답 부족)', detail:`응답 ${covPct}%만 표시됨 — 면담 필수`, margin, second:sorted[1].t, coverage:covPct};
  // 응답률 70%+ & 격차 15%+ → 높음
  if(covPct >= 70 && margin >= 15) return {level:'높음 ✓', detail:`${TN[sorted[0].t]} 우세 (응답 ${covPct}%, 격차 ${margin.toFixed(0)}%p)`, margin, second:sorted[1].t, coverage:covPct};
  // 격차 8%+ → 보통
  if(margin >= 8) return {level:'보통', detail:`${TN[sorted[0].t]} vs ${TN[sorted[1].t]} 추가 면담 권장 (응답 ${covPct}%)`, margin, second:sorted[1].t, coverage:covPct};
  // 그 외 → 낮음
  return {level:'낮음 (감별 필요)', detail:`${TN[sorted[0].t]} vs ${TN[sorted[1].t]} 정밀 감별 필요 (응답 ${covPct}%)`, margin, second:sorted[1].t, coverage:covPct};
}

// 차원별 우세 체질 산출 후 모순 감지 (v21: bipAns 대응)
function detectContradictions(){
  const warns=[];
  // 양극단(체형·음식): yes 응답 카운트
  const tallyBip=(qs)=>{
    const v={ty:0,te:0,sy:0,se:0};
    qs.forEach(q=>{
      const a = bipAns[q.id] || {};
      TYPES.forEach(t => { if(a[t]==='yes') v[t]++; });
    });
    return v;
  };
  // 4지선다: 선택 카운트 (unknown 제외)
  const tallyAns=(qs)=>{
    const v={ty:0,te:0,sy:0,se:0};
    qs.forEach(q=>{
      const a = ans[q.id];
      if(a && a!=='unknown' && v[a]!==undefined) v[a]++;
    });
    return v;
  };
  const bodyV=tallyBip(Q_BODY), charV=tallyAns([...Q_CHAR,...Q_EMO]), foodV=tallyBip(Q_FOOD);
  const bodyDom=topType(bodyV), charDom=topType(charV), foodDom=topType(foodV);

  if(bodyV[bodyDom]>=2 && charV[charDom]>=4 && bodyDom!==charDom){
    warns.push(`체형(${TN[bodyDom]}) ↔ 성격/심리(${TN[charDom]}) 불일치 — 면담 또는 약물반응 시험 권장`);
  }
  if(foodV[foodDom]>=1 && charV[charDom]>=4 && foodDom!==charDom){
    warns.push(`음식 반응(${TN[foodDom]}) ↔ 성격/심리(${TN[charDom]}) 불일치 — 음식 반응이 더 정직한 지표일 수 있음`);
  }
  return warns;
}

function renderCheckScreen(stageNum){
  const stage = stageNum; // 1 or 2
  const isFirst = stage === 1;
  const r = calcStageResult(stage);
  // 스냅샷 저장 (최종 결과지에서 추이 비교용)
  stageSnapshots['check'+stage] = {top:r.top, pcts:{...r.pcts}, coverage:r.coverage};

  const icons = {ty:'☀',te:'木',sy:'火',se:'水'};
  const covPct = Math.round((r.coverage||0)*100);
  const sorted = TYPES.map(t=>({t,p:r.pcts[t]})).sort((a,b)=>b.p-a.p);
  const margin = sorted[0].p - sorted[1].p;

  // 점수 행 (4 체질)
  const scoreRows = TYPES.map(t => `
    <div class="score-row">
      <div class="score-name" style="color:var(--${t})">${TN[t]}</div>
      <div class="score-track"><div class="score-fill fill-${t}" style="width:${r.pcts[t]}%"></div></div>
      <div class="score-pct">${r.pcts[t]}%</div>
      <div class="score-check">${t===r.top?'✓':''}</div>
    </div>`).join('');

  // 2차 점검 시 1차와 비교
  let compareHtml = '';
  if(stage === 2 && stageSnapshots.check1){
    const s1 = stageSnapshots.check1;
    const topChanged = s1.top !== r.top;
    const cmpRows = TYPES.map(t => {
      const before = s1.pcts[t];
      const after = r.pcts[t];
      const delta = after - before;
      const cls = delta > 0 ? 'up' : delta < 0 ? 'down' : 'same';
      const sign = delta > 0 ? '+' : '';
      return `<div class="check-cmp-nm" style="color:var(--${t})">${TN[t]}</div>
        <div class="check-cmp-c">${before}%</div>
        <div class="check-cmp-c">→</div>
        <div class="check-cmp-c ${t===r.top?'dom':''}" style="${t===r.top?`background:var(--${t}-l);color:var(--${t})`:''}">${after}%</div>
        <div class="check-cmp-c"><span class="check-delta ${cls}">${delta===0?'─':sign+delta}p</span></div>`;
    }).join('');
    compareHtml = `
      <div style="font-size:.78rem;font-weight:600;color:var(--txt2);margin-bottom:8px;">1차 → 2차 변화 ${topChanged?`<span class="check-delta up" style="margin-left:8px;">⚡ 1위 변화: ${TN[s1.top]} → ${TN[r.top]}</span>`:''}</div>
      <div class="check-cmp-grid">
        <div class="check-cmp-hdr first">체질</div>
        <div class="check-cmp-hdr">1차</div>
        <div class="check-cmp-hdr"></div>
        <div class="check-cmp-hdr">2차</div>
        <div class="check-cmp-hdr">증감</div>
        ${cmpRows}
      </div>`;
  }

  const nextLabel = stage===1 ? '계속 (성격·심리) →' : '계속 (음식·확정) →';
  const infoText = stage===1
    ? '<b>신체 지표(체형·생리·OX)</b>만으로 추정한 잠정 결과입니다. 성격·심리·음식·확정 문항을 더 거치면서 결과가 정교해집니다.'
    : '<b>신체 + 심리 지표</b>까지 더한 결과입니다. 마지막 음식 반응과 확정 문항으로 최종 결과가 결정됩니다.';

  return `<div class="screen active">
    ${renderProgress()}
    <div class="sec-badge ox">🔍 ${isFirst?'1차':'2차'} 중간 점검</div>
    <div class="step-title">${isFirst?'신체 지표 기반':'신체+심리 합산'} 잠정 결과</div>
    <div class="step-sub">아직 확정 아닙니다 · 추정 1위만 표시합니다.</div>

    <div class="check-hero hero-${r.top}">
      <div class="check-hero-ic" style="background:var(--${r.top})">${icons[r.top]}</div>
      <div>
        <div class="check-hero-lbl" style="color:var(--${r.top}-m)">${isFirst?'1차':'2차'} 추정 1위</div>
        <div class="check-hero-nm" style="color:var(--${r.top})">${TN[r.top]} <span style="font-size:.85rem;opacity:.6;">${TH[r.top]}</span></div>
        <div class="check-hero-meta">${r.pcts[r.top]}% · 2위와 격차 ${margin}%p · 응답률 ${covPct}%</div>
      </div>
    </div>

    <div style="font-size:.78rem;font-weight:600;color:var(--txt2);margin-bottom:8px;">prior 보정 분포</div>
    ${scoreRows}

    ${compareHtml}

    <div class="check-info">${infoText}</div>

    <div class="nav no-print">
      <button class="btn btn-outline" onclick="goBack()">← 이전</button>
      <div style="display:flex;gap:8px;">
        <button class="btn-skip" onclick="skipCheck()">건너뛰기</button>
        <button class="btn btn-primary" onclick="goNext()">${nextLabel}</button>
      </div>
    </div>
  </div>`;
}

function renderResult(){
  // v17: calcScores → {sc, hanyul, hanyul_sy}
  const calc = calcScores();
  const rawSc = calc.sc;
  const hanyulSc = calc.hanyul;
  const hanyulSySc = calc.hanyul_sy;

  // Prior 보정한 분포 (정규화 %)
  const adjPcts = applyPrior(rawSc);
  const adjRounded = {};
  TYPES.forEach(t=> adjRounded[t] = Math.round(adjPcts[t]));
  // 합계 보정 (반올림 오차)
  const diff = 100 - TYPES.reduce((s,t)=>s+adjRounded[t],0);
  if(diff !== 0){
    const big = TYPES.reduce((a,b)=>adjRounded[a]>=adjRounded[b]?a:b);
    adjRounded[big] += diff;
  }
  const pcts = adjRounded;

  const top = judgeResult || topType(adjPcts);
  const info = TYPE_INFO[top];

  // v23: 최종 스냅샷 저장 + 단계별 추이 비교 데이터 준비
  stageSnapshots.final = {top, pcts:{...pcts}, coverage:calc.coverage};
  const s1 = stageSnapshots.check1;
  const s2 = stageSnapshots.check2;
  const sF = stageSnapshots.final;
  // 1·2차를 거치지 않은 경우(원장이 직접 결과 페이지로 점프)도 대비 — 그 자리에서 계산
  const stage1Data = s1 || calcStageResult(1);
  const stage2Data = s2 || calcStageResult(2);
  const stagesAvail = [
    {key:'1차', data:stage1Data},
    {key:'2차', data:stage2Data},
    {key:'최종', data:sF}
  ];
  const stageRankChanged = stagesAvail[0].data.top !== sF.top || stagesAvail[1].data.top !== sF.top;
  const dateStr = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  const icons = {ty:'☀',te:'木',sy:'火',se:'水'};

  // 신뢰도 (margin + 응답 커버리지)
  const confObj = calcConfidence(pcts, calc.coverage);
  const conf = confObj.level;
  const second = confObj.second;
  const diffTipKey = top + '-' + second;
  const diffTip = DIFF_TIPS[diffTipKey] || '';

  // 한열 판정
  const hanyul = determineHanyul(top, hanyulSc, hanyulSySc);
  const hanyulLabel = HANYUL_LABEL[hanyul];
  const rxByHanyul = hanyul==='cold' ? (info.rx_cold||info.rx)
                   : hanyul==='hot'  ? (info.rx_hot ||info.rx)
                   : info.rx;

  // 모순 감지
  const warns = detectContradictions();
  // 태양인 판정 시 추가 경고
  if(top === 'ty'){
    warns.unshift('⚠ 태양인 판정 — 인구 0.1% 미만 극소수 체질. 소양인과 반드시 감별 필요 (약물반응 시험 권장)');
  }

  const scoreRows=TYPES.map(t=>`
    <div class="r-sc-row">
      <div class="r-sc-nm" style="color:var(--${t})">${TN[t]}</div>
      <div class="r-sc-track"><div class="r-sc-fill" style="width:${pcts[t]}%;background:var(--${t})"></div></div>
      <div class="r-sc-pct">${pcts[t]}%</div>
      <div class="r-sc-chk">${t===top?'✓':''}</div>
    </div>`).join('');

  // v22: PART별 응답 카운트 (체형·생리·성격·심리·음식)
  const tallies = calcPartTallies();
  const PART_LABEL = {body:'체형', physio:'생리', char:'성격', emo:'심리', food:'음식'};
  const partRows = Object.entries(tallies).map(([part, v]) => {
    const total = TYPES.reduce((s,t)=>s+v[t],0);
    const dom = total > 0 ? topType(v) : null;
    return `<div class="r-part-nm">${PART_LABEL[part]}</div>
      ${TYPES.map(t=>{
        const isDom = t===dom && v[t]>0;
        return `<div class="r-part-c ${v[t]>0?'has':''} ${isDom?'dom':''}" style="${v[t]>0?`background:var(--${t}-l);color:var(--${t})`:''}">${v[t]}</div>`;
      }).join('')}
      <div class="r-part-d" style="${dom?`color:var(--${dom})`:''}">${dom?TN[dom]:'—'}</div>`;
  }).join('');

  const saengRows=info.saeng.map((s,i)=>`
    <div class="r-saeng-item"><span class="r-saeng-n">${i+1}</span><span>${esc(s)}</span></div>`).join('');

  const summaryMap={ty:'마음의 평정심 + 담백한 식사 + 하체 보호',te:'규칙적 발한 운동 + 과식 금지 + 금연',sy:'분노 조절 + 서늘한 음식 + 허리 보호',se:'따뜻한 식사·환경 + 소화기 보호 + 무리 금지'};

  return `<div class="screen active">

    <div class="r-a4">

      <!-- 헤더 -->
      <div class="r-hd">
        <div class="r-hd-l">
          <div class="r-cn">온 누 리 한 의 원</div>
          <div class="r-ct">사상체질 감별 결과지</div>
        </div>
        <div class="r-hd-r">${esc(pInfo.name)} · ${esc(pInfo.gender)} · ${esc(pInfo.age)}세<br>${dateStr}</div>
      </div>

      <!-- 히어로 -->
      <div class="r-hero hero-${top}">
        <div class="r-hero-ic" style="background:var(--${top})">${icons[top]}</div>
        <div>
          <div class="r-hero-lbl" style="color:var(--${top}-m)">판정 체질</div>
          <div class="r-hero-nm" style="color:var(--${top})">${TN[top]} ${TH[top]}</div>
          <div class="r-hero-sub" style="color:var(--${top}-m)">${TO[top]}</div>
        </div>
      </div>

      <!-- v23: 단계별 추이 비교 (1차·2차·최종) -->
      <div class="r-sec">
        <div class="r-sec-t">진단 단계별 추이 — 신체 → +심리 → +음식·확정${stageRankChanged?'   ⚡ <span style="color:var(--ty);">1위 체질 변동 있음 — 면담 권장</span>':''}</div>
        <div class="r-stage-grid">
          <div class="r-stage-hdr first">단계</div>
          <div class="r-stage-hdr" style="color:var(--ty)">태양</div>

          <div class="r-stage-hdr" style="color:var(--se)">소음</div>
          <div class="r-stage-hdr">1위</div>
          ${stagesAvail.map(s => `

            ${TYPES.map(t => `<div class="r-stage-c ${t===s.data.top?'dom':''}" style="${t===s.data.top?`background:var(--${t}-l);color:var(--${t})`:''}">${s.data.pcts[t]}%</div>`).join('')}
            <div class="r-stage-d" style="color:var(--${s.data.top})">${TN[s.data.top]}</div>

      <div class="r-ic" style="margin-bottom:8px;background:${hanyul==='cold'?'#eaeff8':hanyul==='hot'?'#fdf0f0':'#fef9e6'};border-color:${hanyul==='cold'?'var(--se)':hanyul==='hot'?'var(--ty)':'var(--gold)'};">

          ${hanyulLabel}

            ${top==='sy'
              ? '(소양인: 상복부 가스 여부 기준)'
              : '(일반: 대변 횟수 + 커피 반응 기준)'}

      <div class="r-saeng" style="border-color:var(--${top});background:var(--${top}-l)">

/* ═══════════════════════════════════════════════════
   이벤트 핸들러
═══════════════════════════════════════════════════ */
function selQ(id, v, btn){
  ans[id] = v;
  // 선택 표시 업데이트
  const parent = btn.closest('.q-block');
  parent.querySelectorAll('.opt').forEach(b => { b.className = 'opt'; });
  parent.querySelectorAll('.opt-unknown').forEach(b => { b.classList.remove('act'); });
  if(v === 'unknown'){
    btn.classList.add('act');
  } else {
    btn.classList.add('sel-' + v);
  }
}

function selOx(id, v, btn){
  // 이미 선택된 옵션을 다시 클릭하면 해제
  if(oxAns[id] === v){
    delete oxAns[id];
    btn.classList.remove('act');
    return;
  }
  oxAns[id] = v;
  const row = btn.closest('.ox-row');
  row.querySelectorAll('.ox-btn').forEach(b => b.classList.remove('act'));
  btn.classList.add('act');
}

// v23: 확정 문항 클릭 — yes 시 카드 강조, 동일 버튼 재클릭 시 해제
function selKiller(id, v, btn){
  if(killerAns[id] === v){
    delete killerAns[id];
  } else {
    killerAns[id] = v;
  }
  // UI 갱신
  const card = btn.closest('.killer-card');
  card.querySelectorAll('.killer-btn').forEach(b => b.classList.remove('act'));
  card.classList.remove('has-yes');
  if(killerAns[id] === 'yes'){
    card.querySelector('.killer-btn.yes').classList.add('act');
    card.classList.add('has-yes');
  } else if(killerAns[id] === 'no'){
    card.querySelector('.killer-btn.no').classList.add('act');
  }
}

// v23: 중간 점검 화면에서 건너뛰기 — 다음 입력 화면으로 점프
// check1 (idx 4) → char (idx 5) / check2 (idx 7) → food (idx 8)
function skipCheck(){ if(step < STEPS.length-1){ step++; render(); } }

// v21: 양극단 응답 클릭 핸들러
// 같은 버튼 다시 클릭 → 해제, yes 상태에서 no 클릭 → no로 전환
function selBip(qid, optV, choice, btn){
  if(!bipAns[qid]) bipAns[qid] = {};
  const cur = bipAns[qid][optV];
  if(cur === choice){
    // 동일 버튼 재클릭: 해제
    delete bipAns[qid][optV];
  } else {
    bipAns[qid][optV] = choice;
  }
  // UI 갱신: 해당 row 다시 그리기
  const row = btn.closest('.bip-row');
  const a = bipAns[qid][optV];
  // 버튼 상태
  row.querySelectorAll('.bip-btn').forEach(b => b.classList.remove('act'));
  if(a === 'yes') row.querySelector('.bip-btn.yes').classList.add('act');
  if(a === 'no')  row.querySelector('.bip-btn.no').classList.add('act');
  // row 상태
  row.classList.remove('has-yes','has-no');
  if(a === 'yes') row.classList.add('has-yes');
  if(a === 'no')  row.classList.add('has-no');
}

function updNav(){
  const btn = document.getElementById('btn-next');
  if(!btn) return;
  const s = STEPS[step];
  // info만 필수 입력, 나머지는 항상 진행 가능 (비워두는 것이 정답)
  let ok = true;
  if(s === 'info') ok = !!(pInfo.name && pInfo.gender && pInfo.age);
  btn.disabled = !ok;
}

function showTab(id, btn){
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('act'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('act'));
  const panel = document.getElementById('tab-' + id);
  if(panel) panel.classList.add('act');
  btn.classList.add('act');
}

function setJudge(t){
  judgeResult = t;
  // 판정 버튼 색상만 즉시 업데이트 (re-render 없이)
  document.querySelectorAll('.r-judge-btn').forEach(b => {
    b.style.background = '';
    b.style.color = '';
    b.style.borderColor = '';
    b.style.fontWeight = '';
  });
  const btns = document.querySelectorAll('.r-judge-btn');
  const idx = TYPES.indexOf(t);
  const target = idx >= 0 ? btns[idx] : btns[4];
  if(target){
    if(idx >= 0){
      const col = ['#8B1A1A','#1A4A2E','#A04000','#1A3A6B'][idx];
      const bg  = ['#fdf0f0','#edf7f1','#fef3e6','#eaeff8'][idx];
      target.style.background = bg;
      target.style.color = col;
      target.style.borderColor = col;
      target.style.fontWeight = '600';
    } else {
      target.style.background = '#ede9df';
      target.style.color = '#5C4A1E';
      target.style.borderColor = '#c8c3b8';
      target.style.fontWeight = '600';
    }
  }
}

function goNext(){
  if(step < STEPS.length-1){ step++; render(); }
}
function goBack(){ step--; render(); }
function saveRecord(){
  const calc = calcScores();
  const rawSc = calc.sc;
  const adjPcts = applyPrior(rawSc);
  const pcts = {};
  TYPES.forEach(t=> pcts[t] = Math.round(adjPcts[t]));
  const top = judgeResult || topType(adjPcts);
  const confObj = calcConfidence(pcts, calc.coverage);
  const hanyul = determineHanyul(top, calc.hanyul, calc.hanyul_sy);
  const record={
    id: Date.now(),
    date: new Date().toLocaleDateString('ko-KR'),
    name: pInfo.name,
    gender: pInfo.gender,
    age: pInfo.age,
    result: TN[top],
    resultEn: top,
    hanja: TH[top],
    pcts: pcts,
    judge: judgeResult ? TN[judgeResult] : TN[top],
    conf: confObj.level.replace(/[✓\s]/g,'').replace(/\(.*\)/,''),
    margin: confObj.margin,
    coverage: confObj.coverage,
    hanyul: hanyul,
    hanyulLabel: HANYUL_LABEL[hanyul],
    memo: clinicMemo,
  };
  savedRecords.push(record);
  localStorage.setItem('onnuri_sasang', JSON.stringify(savedRecords));
  return record;
}

function exportCSV(){
  if(!savedRecords.length){ alert('저장된 기록이 없습니다.'); return; }
  const header = ['번호','날짜','이름','성별','나이','설문결과','한자','태양인%','태음인%','소양인%','소음인%','격차%p','한열','원장판정','신뢰도','메모'];
  const rows = savedRecords.map((r,i)=>[
    i+1, r.date, r.name, r.gender, r.age,
    r.result, r.hanja,
    r.pcts.ty, r.pcts.te, r.pcts.sy, r.pcts.se,
    (r.margin!==undefined?r.margin.toFixed(0):''),
    (r.hanyulLabel||''),
    r.judge, r.conf,
    '"'+(r.memo||'').replace(/"/g,'""')+'"'
  ]);
  const bom = '\uFEFF';
  const csv = bom + [header, ...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '온누리_사상체질_감별기록_'+new Date().toLocaleDateString('ko-KR').replace(/\./g,'').replace(/ /g,'')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function deleteRecord(id){
  if(!confirm('이 기록을 삭제하시겠습니까?')) return;
  savedRecords = savedRecords.filter(r=>r.id!==id);
  localStorage.setItem('onnuri_sasang', JSON.stringify(savedRecords));
  showRecords();
}

function showRecords(){
  step = -1;
  render();
}

function resetAll(){
  step = 0;
  ans = {}; oxAns = {}; bipAns = {};
  // v23: 확정 문항·단계 스냅샷 초기화
  killerAns = {};
  stageSnapshots = {check1:null, check2:null};
  judgeResult = null; clinicMemo = '';
  pInfo = {name:'', gender:'', age:''};
  render();
}


function renderRecords(){
  const TY_COLOR={ty:'#8B1A1A',te:'#1A4A2E',sy:'#A04000',se:'#1A3A6B'};
  const TY_BG={ty:'#fdf0f0',te:'#edf7f1',sy:'#fef3e6',se:'#eaeff8'};
  const rows = savedRecords.length === 0
    ? '<div style="text-align:center;padding:2rem;color:#9c9590;font-size:.875rem;">저장된 기록이 없습니다.<br>설문 완료 후 "기록 저장" 버튼을 눌러주세요.</div>'
    : [...savedRecords].reverse().map((r,i)=>{
        const col = TY_COLOR[r.resultEn]||'#1A4A2E';
        const bg  = TY_BG[r.resultEn]||'#edf7f1';
        const num = savedRecords.length - i;
        return `<div style="padding:12px 14px;border:0.5px solid #d8d3c8;border-radius:10px;background:#fff;margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:36px;height:36px;border-radius:50%;background:${bg};border:1.5px solid ${col};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${col};flex-shrink:0;">${esc(r.result[0])}</div>
              <div>
                <div style="font-size:.9rem;font-weight:500;">${esc(r.name)} <span style="font-size:.75rem;color:#9c9590;">${esc(r.gender)} · ${esc(r.age)}세</span></div>
                <div style="font-size:.72rem;color:#9c9590;margin-top:1px;">${esc(r.date)} · #${num}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="padding:3px 10px;border-radius:100px;background:${bg};color:${col};font-size:.72rem;font-weight:600;border:1px solid ${col};">${esc(r.result)}</span>
              <button onclick="deleteRecord(${r.id})" style="padding:3px 8px;border:0.5px solid #d8d3c8;border-radius:6px;background:#fff;font-size:.7rem;color:#9c9590;cursor:pointer;">삭제</button>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
            ${TYPES.map(t=>`<div style="text-align:center;padding:4px;border-radius:5px;background:${t===r.resultEn?TY_BG[t]:'#f5f3ed'};"><div style="font-size:.65rem;color:${TY_COLOR[t]};">${TN[t]}</div><div style="font-size:.8rem;font-weight:${t===r.resultEn?'600':'400'};color:${TY_COLOR[t]};">${r.pcts[t]}%</div></div>`).join('')}
          </div>
          ${r.memo?`<div style="margin-top:6px;padding:5px 8px;background:#f5f3ed;border-radius:5px;font-size:.75rem;color:#5C4A1E;">${esc(r.memo)}</div>`:''}
        </div>`;
      }).join('');

  return `<div class="screen active">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
      <div>
        <div style="font-size:.7rem;color:#9c9590;margin-bottom:3px;">총 ${savedRecords.length}건 저장됨</div>
        <div style="font-size:1.1rem;font-weight:500;">저장된 감별 기록</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button onclick="exportCSV()" style="padding:7px 14px;border:1px solid #1A4A2E;border-radius:8px;background:#edf7f1;color:#1A4A2E;font-size:.8rem;cursor:pointer;font-family:var(--sans);font-weight:500;">📊 CSV 내보내기</button>
        <button onclick="resetAll()" style="padding:7px 14px;border:1px solid #d8d3c8;border-radius:8px;background:#fff;color:#6b6560;font-size:.8rem;cursor:pointer;font-family:var(--sans);">← 돌아가기</button>
      </div>
    </div>
    ${rows}
  </div>`;
}

let _autoTimer = null;
function render(){
  // 자동이동 타이머 초기화 (화면 전환 시 중복 방지)
  if(_autoTimer){ clearTimeout(_autoTimer); _autoTimer = null; }
  if(step === -1){
    document.getElementById('wrap').innerHTML = renderRecords();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  const s=STEPS[step];
  const screens={
    info:renderInfo,body:renderBody,physio:renderPhysio,
    ox:renderOx,
    check1:renderCheck1,                              // v23: 1차 중간 점검
    char:renderChar,emo:renderEmo,
    check2:renderCheck2,                              // v23: 2차 중간 점검
    food:renderFood,
    killer:renderKiller,                              // v23: 확정 문항
    result:renderResult,
  };
  document.getElementById('wrap').innerHTML=screens[s]();
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
