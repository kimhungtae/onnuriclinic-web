<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온누리 한의원 — 정밀 시진 C-1 (태음↔소양)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --taeum:#2D7D46; --taeum-l:#E8F5EC; --taeum-bg:#F4FBF6;
  --soyang:#D4691E; --soyang-l:#FDF1E5; --soyang-bg:#FEF8F2;
  --gold:#C49A3F; --gold-l:#FEF9E6;
  --ink:#1a1a1a; --sub:#555; --line:#d5d5d5;
  --bg:#faf8f3; --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif;
  --pale:#f7f5f0; --txt3:#9c9590; --bg2:#f1ede4; --star:#c9302c;
}
html{font-size:16px;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}

/* ── 레이아웃 ── */
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 56px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px 28px;box-shadow:0 2px 12px rgba(0,0,0,.05);}

/* ── 안전 배너 (§10.1) ── */
.safety-banner{background:#fdf3f3;border:1px solid #e3b9b9;color:#8a3a3a;font-size:.75rem;
  padding:8px 14px;border-radius:6px;text-align:center;margin-bottom:14px;line-height:1.5;}

/* ── 헤더 ── */
.head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px;}
.h-top{display:flex;justify-content:space-between;align-items:baseline;}
.clinic{font-size:.72rem;letter-spacing:1.5px;color:var(--sub);}
.ver{font-size:.68rem;color:var(--gold);font-weight:700;letter-spacing:1px;}
.h-title{font-family:var(--serif);font-size:1.4rem;font-weight:700;margin-top:6px;}
.h-sub{font-size:.78rem;color:var(--sub);margin-top:6px;}
.h-patient{font-size:.8rem;margin-top:10px;background:var(--pale);padding:8px 12px;border-radius:5px;}

/* ── info 화면 ── */
.info-sec{padding:12px 0;border-bottom:1px solid var(--line);}
.info-sec:last-of-type{border-bottom:none;}
.info-row{display:flex;gap:12px;font-size:.88rem;padding:4px 0;}
.info-lbl{width:78px;color:var(--sub);font-weight:500;flex-shrink:0;}
.info-val{flex:1;}
.muted{color:var(--txt3);}
.warn{background:var(--gold-l);border:1px solid #e0cf8e;border-radius:6px;
  padding:13px 15px;font-size:.83rem;line-height:1.6;color:#5a4d20;}
.name-grid{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;margin-top:10px;}
.fld{padding:9px 11px;border:1px solid var(--line);border-radius:5px;
  font-family:inherit;font-size:.85rem;background:#fff;color:var(--ink);}
.fld:focus{outline:none;border-color:var(--taeum);}

/* ── 안내 박스 (§10.2) ── */
.guide{background:var(--gold-l);border-left:3px solid var(--gold);padding:11px 14px;
  font-size:.78rem;line-height:1.7;color:#5a4d20;margin:16px 0;}
.guide b{color:var(--gold);}

/* ── 비교 표 ── */
.table-wrap{overflow-x:auto;}
.compare{width:100%;border-collapse:collapse;border:1px solid var(--line);}
.compare th{padding:11px;font-size:.92rem;font-weight:700;border:1px solid var(--line);}
.compare th.cat-h{background:var(--bg2);color:var(--ink);width:132px;font-size:.8rem;}
.compare th.t-head{background:var(--taeum-l);color:var(--taeum);}
.compare th.s-head{background:var(--soyang-l);color:var(--soyang);}
.compare td{border:1px solid var(--line);padding:8px 12px;vertical-align:top;}
.compare td.cat-cell{background:#f7f4ec;text-align:center;font-weight:600;
  font-size:.78rem;color:var(--sub);width:132px;}
.cat-no{display:block;color:var(--gold);font-size:.6rem;letter-spacing:1px;margin-bottom:3px;}
.cat-sub{font-weight:400;font-size:.66rem;color:#999;}
.compare td.t-cell{background:var(--taeum-bg);}
.compare td.s-cell{background:var(--soyang-bg);}

/* ── 변별 항목 ── */
.item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer;
  font-size:.84rem;line-height:1.5;}
.item input{margin:3px 0 0;width:15px;height:15px;flex-shrink:0;cursor:pointer;}
.t-cell .item input{accent-color:var(--taeum);}
.s-cell .item input{accent-color:var(--soyang);}
.item-txt{flex:1;}
.star{color:var(--star);font-weight:700;font-size:.7rem;margin-left:4px;white-space:nowrap;}
.killer{background:#fff3f0;color:var(--star);font-weight:600;font-size:.66rem;
  padding:1px 5px;border-radius:3px;margin-left:5px;white-space:nowrap;}

/* ── 카운터 + 판정 박스 (§9.3, sticky) ── */
.counter-bar{position:sticky;bottom:0;z-index:5;background:#fff;border:1px solid var(--line);
  border-top:2px solid var(--ink);box-shadow:0 -4px 16px rgba(0,0,0,.08);
  padding:12px 16px;margin-top:14px;}
.cnt-row{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:10px;}
.cnt-side{display:flex;align-items:center;gap:8px;font-size:.82rem;}
.cnt-name{font-weight:700;}
.cnt-side.t .cnt-name{color:var(--taeum);}
.cnt-side.s .cnt-name{color:var(--soyang);}
.cnt-pill{background:var(--bg2);padding:3px 11px;border-radius:4px;}
.cnt-pill b{font-size:.95rem;}
.vb{padding:10px 14px;border:1.5px solid;border-radius:6px;font-size:.86rem;line-height:1.55;}
.vb.empty{background:#f4f4f0;border-color:var(--line);color:var(--sub);text-align:center;}
.vb-reason{font-size:.78rem;color:var(--sub);}

/* ── 액션 버튼 ── */
.btn{padding:10px 18px;border-radius:6px;font-size:.85rem;font-family:inherit;
  cursor:pointer;border:1.5px solid;}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-line{background:#fff;color:var(--ink);border-color:var(--line);}
.btn-dark:hover{opacity:.88;}
.btn-line:hover{background:var(--bg2);}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.actions-card{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;}

/* ── 판정 결과 화면 (§9.5) ── */
.verdict-card{padding:20px 22px;border:2px solid;border-radius:8px;margin-bottom:18px;}
.vc-label{font-size:.7rem;color:var(--sub);letter-spacing:1.5px;margin-bottom:8px;}
.vc-msg{font-size:1.02rem;line-height:1.65;}
.vc-msg b{font-size:1.16rem;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.side-sum{border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.side-sum.t .ss-head{background:var(--taeum-l);color:var(--taeum);}
.side-sum.s .ss-head{background:var(--soyang-l);color:var(--soyang);}
.ss-head{padding:8px 12px;font-weight:700;font-size:.82rem;}
.ss-list{list-style:none;padding:8px 12px;margin:0;}
.ss-list li{font-size:.8rem;line-height:1.5;padding:3px 0;display:flex;gap:7px;}
.sm-mark{color:var(--star);font-weight:700;font-size:.64rem;flex-shrink:0;min-width:26px;}
.sm-none{color:var(--txt3);font-style:italic;}

/* ── 푸터 (§10.3, §10.4) ── */
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);}
.safe-notes{font-size:.74rem;color:#7a6a3a;line-height:1.75;
  background:var(--gold-l);border-radius:6px;padding:9px 13px;}
.source{font-size:.7rem;color:var(--txt3);margin-top:8px;text-align:right;}

/* ── 인쇄 (§10.5, A4 1쪽) ── */
@media print{
  @page{margin:12mm;}
  body{background:#fff;}
  .no-print{display:none!important;}
  .wrap{max-width:100%;padding:0;}
  .card,.actions-card{border:none;box-shadow:none;padding:0;border-radius:0;}
  .counter-bar{position:static;box-shadow:none;border:1px solid #ccc;margin-top:10px;}
  .verdict-card{background:#fff!important;border-color:#999!important;}
  .vb{background:#fff!important;border-color:#999!important;}
  .verdict-card,.summary-grid,.side-sum,.foot,.compare tr{break-inside:avoid;}
  .h-title{font-size:1.2rem;}
  .summary-grid{gap:8px;}
  .ss-list li{font-size:.72rem;}
  .vc-msg{font-size:.92rem;}
}

/* ── 반응형 ── */
@media(max-width:560px){
  .name-grid{grid-template-columns:1fr 70px 70px;}
  .summary-grid{grid-template-columns:1fr;}
  .cnt-row{gap:14px;}
}
</style>
</head>
<body>
<div class="no-print" style="max-width:900px;margin:0 auto;padding:18px 16px 0;">
<button onclick="location.href='온누리_사상체질_홈_v1.html'" style="font-family:inherit;font-weight:500;font-size:.84rem;background:#fff;color:#444;border:1px solid #c9c4bb;border-radius:8px;padding:8px 15px;cursor:pointer;">← 통합 홈으로 돌아가기</button>
</div>
<div id="wrap" class="wrap"></div>
<script>
/* ═══════════════════════════════════════════════════
   온누리 정밀 시진 C-1 (태음 ↔ 소양)
   모듈 A 후속 확증 차트 · vanilla JS · 외부 라이브러리 0개
═══════════════════════════════════════════════════ */

/* ── §6 변별 항목 데이터 (한 글자도 수정 금지) ── */
const C1_ITEMS = {
  taeum: [
    // CAT 1 흉곽 형태
    { id:'t1-1', cat:1, killer:true,  text:'앞뒤로 두툼하고 둥근 원통형(종형)' },
    { id:'t1-2', cat:1, killer:true,  text:'흉골각이 손가락 2개 이상으로 넓다' },
    { id:'t1-3', cat:1, killer:false, text:'허리둘레가 굵어 몸통이 꽉 차 있다' },
    // CAT 2 엉덩이·하체
    { id:'t2-1', cat:2, killer:false, text:'허리 굵고 바지 허리 치수에 몸을 맞춤' },
    { id:'t2-2', cat:2, killer:false, text:'복부·허리가 발달, 전체적 원통형' },
    // CAT 3 얼굴·기세
    { id:'t3-1', cat:3, killer:false, text:'얼굴 골격이 크고 이목구비가 넓게 퍼져 있다' },
    { id:'t3-2', cat:3, killer:false, text:'이마가 평평하고 양미간이 넓다 (동전 하나 폭)' },
    { id:'t3-3', cat:3, killer:false, text:'안색이 홍조를 띠며 탁하게(검게) 보인다' },
    { id:'t3-4', cat:3, killer:false, text:'목이 굵고 짧음 (목·어깨 경계 불분명)' },
    // CAT 4 입
    { id:'t4-1', cat:4, killer:true,  text:'입이 크고 구각(입꼬리)이 넓다',
      note:'소양 배제 지표' },
    // CAT 5 음용수·구갈
    { id:'t5-1', cat:5, killer:false, text:'평소 물을 잘 안 마신다 (음주자 제외)' },
    { id:'t5-2', cat:5, killer:true,  text:'구갈 시 입천장과 코가 마른다고 표현' },
    { id:'t5-3', cat:5, killer:true,  text:'땀이 충분히 나면 개운, 안 나면 답답·무거움' },
  ],
  soyang: [
    // CAT 1 흉곽 형태
    { id:'s1-1', cat:1, killer:true,  text:'가슴·어깨가 좌우로 넓고 허리 아래 급격히 좁아짐(역삼각)' },
    { id:'s1-2', cat:1, killer:false, text:'흉골각이 좁다 (손가락 1개 이내)' },
    { id:'s1-3', cat:1, killer:false, text:'상체 길고 하체가 짧다' },
    // CAT 2 엉덩이·하체
    { id:'s2-1', cat:2, killer:true,  text:'어깨 넓으나 엉덩이 작고 가벼움',
      note:'핵심 결정타' },
    { id:'s2-2', cat:2, killer:false, text:'오래 앉아 있으면 불편해함' },
    { id:'s2-3', cat:2, killer:false, text:'발이 키에 비해 작고 짧다' },
    // CAT 3 얼굴·기세
    { id:'s3-1', cat:3, killer:true,  text:'이마·미간이 돌출, 가운데로 몰리는 느낌' },
    { id:'s3-2', cat:3, killer:false, text:'말상·계란형, 아래턱 두터워 안정감' },
    { id:'s3-3', cat:3, killer:false, text:'안색이 누렇고 검은 편 (혹은 뺨만 붉음)' },
    { id:'s3-4', cat:3, killer:false, text:'눈빛 표예(剽銳), 동작이 경급(輕急)함' },
    // CAT 4 입
    { id:'s4-1', cat:4, killer:false, text:'이목구비가 오밀조밀, 아래턱이 짧고 갸름함' },
    // CAT 5 음용수·구갈
    { id:'s5-1', cat:5, killer:false, text:'위열 시 다음(多飮), 냉수를 즐겨 찾음' },
    { id:'s5-2', cat:5, killer:true,  text:'구갈 시 인후부가 마른다고 표현' },
    { id:'s5-3', cat:5, killer:true,  text:'대변 시원할 때 컨디션 최상' },
  ]
};
const CAT_LABELS = {
  1: { name:'흉곽 형태',     subtitle:'옆에서 관찰' },
  2: { name:'엉덩이·하체',   subtitle:'안정감·무게중심' },
  3: { name:'얼굴·기세',     subtitle:'기세로 본다' },
  4: { name:'입의 크기',     subtitle:'강력한 배제 지표' },
  5: { name:'음용수·구갈',   subtitle:'한열·표리 단서' },
};

/* ── §7 판정 로직 (순수 함수) ── */
function evaluateVerdict(checks) {
  // checks 형태: { taeum: { killer:N, normal:N }, soyang: { killer:N, normal:N } }
  const t = checks.taeum;
  const s = checks.soyang;
  // 조건 1: 한쪽에만 ★★ 결정타 체크 → 그 체질 확정
  if (t.killer > 0 && s.killer === 0) {
    return { verdict:'taeum', confidence:'high', reason:'태음 결정타 단독' };
  }
  if (s.killer > 0 && t.killer === 0) {
    return { verdict:'soyang', confidence:'high', reason:'소양 결정타 단독' };
  }
  // 조건 2: 양쪽 모두 ★★ 결정타 체크 → 보류, 기능 검사로
  if (t.killer > 0 && s.killer > 0) {
    return { verdict:'pending', confidence:'low', reason:'양쪽 결정타 충돌 — 기능 검사 필요' };
  }
  // 조건 3: 양쪽 모두 ★★ 없음 → ★ 일반 단서 비교
  const diff = t.normal - s.normal;
  if (diff >= 3)  return { verdict:'taeum',   confidence:'medium', reason:`★ 단서 ${diff}개 우위` };
  if (diff <= -3) return { verdict:'soyang',  confidence:'medium', reason:`★ 단서 ${-diff}개 우위` };
  // 그 외 (1~2개 차이 또는 동일) → 보류
  return { verdict:'pending', confidence:'low', reason:'★ 단서 차이 부족 — 기능 검사 필요' };
}

/* ── 상태 ── */
let step = 0;  // 0:info, 1:chart, 2:verdict
let session = JSON.parse(localStorage.getItem('onnuri_session') || '{}');
let checks = { taeum:{}, soyang:{} };   // checked id → true

/* ── 유틸 ── */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function itemsByCat(side, cat){
  return C1_ITEMS[side].filter(function(it){ return it.cat === cat; });
}
function findItem(side, id){
  return C1_ITEMS[side].filter(function(it){ return it.id === id; })[0] || null;
}

/* ── 세션 ── */
function loadSession(){
  session = JSON.parse(localStorage.getItem('onnuri_session') || '{}');
  // §12: moduleC 있으면 판정 화면 복원, 체크 상태도 되살림
  if (session.moduleC && session.moduleC.checks){
    ['taeum','soyang'].forEach(function(side){
      const sc = session.moduleC.checks[side];
      ((sc && sc.items) || []).forEach(function(id){ checks[side][id] = true; });
    });
    step = 2;
  }
}
function saveSession(){
  localStorage.setItem('onnuri_session', JSON.stringify(session));
}

/* ── 체크 집계 ── */
function computeChecks(){
  const out = {
    taeum:  { killer:0, normal:0, items:[] },
    soyang: { killer:0, normal:0, items:[] },
  };
  ['taeum','soyang'].forEach(function(side){
    C1_ITEMS[side].forEach(function(it){
      if (checks[side][it.id]){
        out[side].items.push(it.id);
        if (it.killer) out[side].killer++;
        else out[side].normal++;
      }
    });
  });
  return out;
}
function totalChecked(c){
  return c.taeum.killer + c.taeum.normal + c.soyang.killer + c.soyang.normal;
}

/* ── 환자·모듈 A 표시 ── */
function fmtPct(v){
  if (v === null || v === undefined || isNaN(v)) return '—';
  v = Number(v);
  return (v <= 1 ? Math.round(v * 100) : Math.round(v)) + '%';
}
function fmtConf(c){
  if (c === null || c === undefined) return '';
  const map = { low:'낮음', medium:'보통', mid:'보통', high:'높음' };
  if (typeof c === 'number') return fmtPct(c);
  return map[c] || String(c);
}
function patientLine(){
  const p = session.patient || {};
  const bits = [];
  bits.push(p.name ? esc(p.name) : '환자 정보 없음');
  if (p.gender) bits.push(esc(p.gender));
  if (p.age) bits.push(esc(String(p.age)) + '세');
  return bits.join(' · ');
}
function moduleASummary(){
  const ma = session.moduleA;
  if (!ma || !ma.result) return null;
  const pcts = ma.result.pcts || {};
  const conf = fmtConf(ma.result.confidence);
  return '모듈 A 결과: 태음 ' + fmtPct(pcts.te) + ' / 소양 ' + fmtPct(pcts.sy)
    + (conf ? ' (신뢰도 ' + conf + ')' : '');
}

/* ── 판정 메시지 스타일 (§7.1) ── */
function verdictStyle(verdict, confidence, reason, c){
  const n = Math.abs(c.taeum.normal - c.soyang.normal);
  if (verdict === 'taeum'){
    if (confidence === 'high')
      return { bg:'var(--taeum-l)', border:'var(--taeum)',
        html:'<b>태음인</b> 확정 — 결정타 단서. 처방 추천(모듈 E)으로 진행하세요.' };
    return { bg:'var(--taeum-bg)', border:'var(--taeum)',
      html:'<b>태음인</b> 우세 — ★ 단서 ' + n + '개 우위. 처방 추천으로 진행 또는 기능 검사로 보강.' };
  }
  if (verdict === 'soyang'){
    if (confidence === 'high')
      return { bg:'var(--soyang-l)', border:'var(--soyang)',
        html:'<b>소양인</b> 확정 — 결정타 단서. 처방 추천(모듈 E)으로 진행하세요.' };
    return { bg:'var(--soyang-bg)', border:'var(--soyang)',
      html:'<b>소양인</b> 우세 — ★ 단서 ' + n + '개 우위. 처방 추천으로 진행 또는 기능 검사로 보강.' };
  }
  return { bg:'var(--gold-l)', border:'var(--gold)',
    html:'<b>보류</b> — 기능 검사(모듈 D)로 진행하여 맥진·복진·약물 시험 필요'
      + '<br><span class="vb-reason">사유: ' + esc(reason || '') + '</span>' };
}

/* ── 공통 조각 ── */
function banner(){
  return '<div class="safety-banner no-print">본 도구는 임상 의사결정 지원 도구이며 의료기기가 아닙니다. '
    + '최종 진단·처방은 원장님이 환자를 직접 확인하고 결정합니다.</div>';
}
function footer(){
  return '<div class="foot">'
    + '<div class="safe-notes">'
    +   '<div>※ 한 가지 증상의 호전만으로 체질·처방을 확정하지 않습니다 (안준철)</div>'
    +   '<div>※ 체질과 한열은 항상 전제로 하고 약물 적합성을 확인합니다 (안준철)</div>'
    + '</div>'
    + '<div class="source">변별 항목 출처: 안준철·하만종·김주 사상의학 강의록</div>'
    + '</div>';
}
function headBlock(title, subOrPatient, isPatient){
  return '<div class="head">'
    + '<div class="h-top"><span class="clinic">온누리 한의원</span>'
    + '<span class="ver">v1 · 정밀 시진 C-1</span></div>'
    + '<div class="h-title">' + title + '</div>'
    + (isPatient
        ? '<div class="h-patient">' + subOrPatient + '</div>'
        : '<div class="h-sub">' + subOrPatient + '</div>')
    + '</div>';
}

/* ═══ 화면 0 — screen-info ═══ */
function renderInfo(){
  const hasA = !!(session.moduleA && session.moduleA.result);
  const p = session.patient || {};
  let patientBlock;
  if (p.name){
    const extra = [ p.gender ? esc(p.gender) : '', p.age ? esc(String(p.age)) + '세' : '' ]
      .filter(Boolean).join(' · ');
    patientBlock = '<div class="info-row"><span class="info-lbl">환자</span>'
      + '<span class="info-val">' + esc(p.name) + (extra ? ' · ' + extra : '') + '</span></div>';
  } else {
    patientBlock = '<div class="info-row"><span class="info-lbl">환자</span>'
      + '<span class="info-val muted">환자 정보 없음 — 아래에 입력하거나 비워둘 수 있습니다</span></div>'
      + '<div class="name-grid">'
      + '<input id="in-name" class="fld" placeholder="환자명">'
      + '<select id="in-gender" class="fld"><option value="">성별</option>'
      + '<option value="남">남</option><option value="여">여</option></select>'
      + '<input id="in-age" class="fld" type="number" min="0" max="120" placeholder="나이">'
      + '</div>';
  }
  let aBlock, startBtn;
  if (hasA){
    aBlock = '<div class="info-row"><span class="info-lbl">모듈 A</span>'
      + '<span class="info-val">' + esc(moduleASummary()) + '</span></div>';
    startBtn = '<div class="actions"><button class="btn btn-dark" onclick="startChart()">변별 시작 →</button></div>';
  } else {
    aBlock = '<div class="warn">자가설문(모듈 A) 결과가 없습니다. 모듈 A를 먼저 진행해야 '
      + '정밀 시진을 시작할 수 있습니다.<br><br>'
      + '<button class="btn btn-line" onclick="goToModuleA()">→ 모듈 A (자가설문 v24) 열기</button></div>';
    startBtn = '';
  }
  return banner()
    + '<div class="card">'
    +   headBlock('사상체질 정밀 시진 — 태음 ↔ 소양',
          '자가설문(모듈 A) 신뢰도가 70% 미만이거나 태음·소양이 경합일 때 사용하는 원장용 확증 차트입니다.', false)
    +   '<div class="info-sec">' + patientBlock + '</div>'
    +   '<div class="info-sec">' + aBlock + '</div>'
    +   startBtn
    + '</div>'
    + footer();
}

/* ═══ 화면 1 — screen-chart ═══ */
function renderItem(it, side){
  const checked = checks[side][it.id] ? ' checked' : '';
  let tag;
  if (it.killer && it.note)  tag = '<span class="killer">★★ ' + esc(it.note) + '</span>';
  else if (it.killer)        tag = '<span class="star">★★</span>';
  else                       tag = '<span class="star">★</span>';
  return '<label class="item">'
    + '<input type="checkbox" id="chk-' + it.id + '"' + checked
    + ' data-side="' + side + '" data-killer="' + it.killer + '" data-cat="' + it.cat + '"'
    + ' onchange="onCheckChange(\'' + it.id + '\',\'' + side + '\')">'
    + '<span class="item-txt">' + esc(it.text) + tag + '</span>'
    + '</label>';
}
function chartTable(){
  let rows = '';
  [1,2,3,4,5].forEach(function(cat){
    const lbl = CAT_LABELS[cat];
    rows += '<tr>'
      + '<td class="cat-cell"><span class="cat-no">CAT ' + cat + '</span>'
      +   esc(lbl.name) + '<br><span class="cat-sub">' + esc(lbl.subtitle) + '</span></td>'
      + '<td class="t-cell">'
      +   itemsByCat('taeum', cat).map(function(it){ return renderItem(it,'taeum'); }).join('')
      + '</td>'
      + '<td class="s-cell">'
      +   itemsByCat('soyang', cat).map(function(it){ return renderItem(it,'soyang'); }).join('')
      + '</td></tr>';
  });
  return '<table class="compare"><thead><tr>'
    + '<th class="cat-h">변별 항목</th>'
    + '<th class="t-head">태음인 특징</th>'
    + '<th class="s-head">소양인 특징</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}
function verdictBoxInner(c){
  if (totalChecked(c) === 0){
    return '<div class="vb empty">항목을 체크하면 판정이 표시됩니다.</div>';
  }
  const v = evaluateVerdict(c);
  const st = verdictStyle(v.verdict, v.confidence, v.reason, c);
  return '<div class="vb" style="background:' + st.bg + ';border-color:' + st.border + '">'
    + st.html + '</div>';
}
function counterInner(){
  const c = computeChecks();
  return '<div class="cnt-row">'
    + '<div class="cnt-side t"><span class="cnt-name">태음 측</span>'
    +   '<span class="cnt-pill">★★ <b id="cnt-t-k">' + c.taeum.killer + '</b></span>'
    +   '<span class="cnt-pill">★ <b id="cnt-t-n">' + c.taeum.normal + '</b></span></div>'
    + '<div class="cnt-side s"><span class="cnt-name">소양 측</span>'
    +   '<span class="cnt-pill">★★ <b id="cnt-s-k">' + c.soyang.killer + '</b></span>'
    +   '<span class="cnt-pill">★ <b id="cnt-s-n">' + c.soyang.normal + '</b></span></div>'
    + '</div>'
    + '<div id="verdictBox">' + verdictBoxInner(c) + '</div>';
}
function renderChart(){
  const ma = moduleASummary();
  return banner()
    + '<div class="card">'
    +   headBlock('사상체질 정밀 시진 차트 — 태음 ↔ 소양',
          patientLine() + (ma ? ' &nbsp;·&nbsp; ' + esc(ma) : ''), true)
    +   '<div class="guide"><b>판정 원칙</b><br>'
    +     '★★ 결정타 항목이 한쪽에서만 체크되면 그 체질로 확정합니다.<br>'
    +     '결정타가 없으면 ★ 일반 단서의 체크 수를 비교해 3개 이상 차이 나는 쪽으로 판정합니다.<br>'
    +     '1~2개 차이라면 기능 검사(모듈 D)로 진행하세요.</div>'
    +   '<div class="table-wrap">' + chartTable() + '</div>'
    + '</div>'
    + '<div class="counter-bar" id="counterBar">' + counterInner() + '</div>'
    + '<div class="actions-card no-print">'
    +   '<button class="btn btn-line" onclick="goToModuleA()">← 모듈 A로 돌아가기</button>'
    +   '<button class="btn btn-line" onclick="clearChecks()">모든 체크 해제</button>'
    +   '<button class="btn btn-dark" onclick="confirmVerdict()">판정 확정 →</button>'
    + '</div>'
    + footer();
}

/* ═══ 화면 2 — screen-verdict ═══ */
function sideSummary(side, data){
  const name = side === 'taeum' ? '태음인' : '소양인';
  const cls  = side === 'taeum' ? 't' : 's';
  const items = (data.items || [])
    .map(function(id){ return findItem(side, id); })
    .filter(Boolean)
    .sort(function(a,b){ return (b.killer?1:0) - (a.killer?1:0); });
  const lis = items.length
    ? items.map(function(it){
        return '<li><span class="sm-mark">' + (it.killer ? '★★' : '★') + '</span>'
          + esc(it.text) + '</li>';
      }).join('')
    : '<li class="sm-none">체크된 항목이 없습니다</li>';
  return '<div class="side-sum ' + cls + '">'
    + '<div class="ss-head">' + name + ' 측 &nbsp; ★★ ' + data.killer + ' · ★ ' + data.normal + '</div>'
    + '<ul class="ss-list">' + lis + '</ul></div>';
}
function renderVerdict(){
  const mc = session.moduleC;
  if (!mc){ step = 1; return renderChart(); }
  const c = mc.checks || { taeum:{killer:0,normal:0,items:[]}, soyang:{killer:0,normal:0,items:[]} };
  const st = verdictStyle(mc.verdict, mc.confidence, mc.reason, c);
  const isPending = mc.verdict === 'pending';
  const nextBtn = isPending
    ? '<button class="btn btn-dark" onclick="goToModuleD()">기능 검사(모듈 D) 진행 →</button>'
    : '<button class="btn btn-dark" onclick="goToModuleE()">처방 추천(모듈 E) 진행 →</button>';
  const ma = moduleASummary();
  return banner()
    + '<div class="card">'
    +   headBlock('정밀 시진 판정 결과 — 태음 ↔ 소양',
          patientLine() + (ma ? ' &nbsp;·&nbsp; ' + esc(ma) : ''), true)
    +   '<div class="verdict-card" style="background:' + st.bg + ';border-color:' + st.border + '">'
    +     '<div class="vc-label">원장 판정</div>'
    +     '<div class="vc-msg">' + st.html + '</div>'
    +   '</div>'
    +   '<div class="summary-grid">'
    +     sideSummary('taeum', c.taeum)
    +     sideSummary('soyang', c.soyang)
    +   '</div>'
    +   '<div class="actions no-print">'
    +     nextBtn
    +     '<button class="btn btn-line" onclick="printResult()">결과 인쇄</button>'
    +     '<button class="btn btn-line" onclick="backToChart()">← 차트로 돌아가기</button>'
    +   '</div>'
    + '</div>'
    + footer();
}

/* ── 이벤트 핸들러 ── */
function startChart(){
  if (!(session.patient && session.patient.name)){
    const nm = document.getElementById('in-name');
    const gd = document.getElementById('in-gender');
    const ag = document.getElementById('in-age');
    session.patient = Object.assign({}, session.patient, {
      name:   nm ? nm.value.trim() : '',
      gender: gd ? gd.value : '',
      age:    ag ? ag.value : '',
    });
    saveSession();
  }
  step = 1;
  render();
}
function onCheckChange(id, side){
  if (checks[side][id]) delete checks[side][id];
  else checks[side][id] = true;
  refreshCounter();
}
function refreshCounter(){
  const c = computeChecks();
  const set = function(elId, val){
    const el = document.getElementById(elId);
    if (el) el.textContent = val;
  };
  set('cnt-t-k', c.taeum.killer);
  set('cnt-t-n', c.taeum.normal);
  set('cnt-s-k', c.soyang.killer);
  set('cnt-s-n', c.soyang.normal);
  const vb = document.getElementById('verdictBox');
  if (vb) vb.innerHTML = verdictBoxInner(c);
}
function clearChecks(){
  if (!confirm('체크한 모든 항목을 해제하시겠습니까?')) return;
  checks = { taeum:{}, soyang:{} };
  render();
}
function confirmVerdict(){
  const c = computeChecks();
  const v = evaluateVerdict(c);
  session.moduleC = {
    pair: 'taeum_soyang',
    checks: c,
    verdict: v.verdict,
    confidence: v.confidence,
    reason: v.reason,
    completedAt: Date.now(),
  };
  saveSession();
  step = 2;
  render();
}
function backToChart(){ step = 1; render(); }
function printResult(){ window.print(); }
function goToModuleA(){ location.href = '온누리_사상체질_감별설문지_v24.html'; }
function goToModuleD(){ location.href = '온누리_기능검사_D_v1.html'; }
function goToModuleE(){ location.href = '온누리_처방추천_E_v1.html'; }

/* ── 렌더 ── */
function render(){
  const screens = [renderInfo, renderChart, renderVerdict];
  if (step < 0 || step > 2) step = 0;
  document.getElementById('wrap').innerHTML = screens[step]();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ── 진입점 ── */
loadSession();
render();
</script>
</body>
</html>
